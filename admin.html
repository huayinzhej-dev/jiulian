// ========== PRODUCTS ==========
// 分类是两级的：一级只做分组（前台商品弹窗里的分类标签按二级出），二级才是商品真正挂的那一层。
// 这张表同时还是报价单/线索/刀模的「盒型」字典，所以列表里必须看得出层级、
// 并且让没归级的老盒型照样能选（见 catOptions）。
// 三条产品线（一级）。名称来自首页「产品中心」那句副标题：PET包装盒 + 精品彩盒 + 瓦楞外箱。
// aliases 是关键：他早就在后台自己建过三条一级（slug 是 pet-pack / color-print-pack / corrugated-pack），
// 数据里认得出别名的那一行就直接拿来当产品线，绝不能再插一条同名的进去（否则分类页会出现 6 个一级）。
const CAT_LINES = [
  { id: 'CAT-L1-PET', name: 'PET包装', nameEn: 'PET Packaging', nameBm: 'Pembungkusan PET', slug: 'pet-packaging', icon: '🥡', sort: 1,
    aliases: ['pet-pack', 'pet-packaging', 'pet包装', 'pet packaging'] },
  { id: 'CAT-L1-COLOUR', name: '精品彩盒', nameEn: 'Colour Boxes', nameBm: 'Kotak Warna', slug: 'colour-boxes', icon: '🎁', sort: 2,
    aliases: ['color-print-pack', 'colour-boxes', '彩盒彩卡', '精品彩盒'] },
  { id: 'CAT-L1-CARTON', name: '瓦楞外箱', nameEn: 'Corrugated Cartons', nameBm: 'Kadbod Berombak', slug: 'corrugated-cartons', icon: '📦', sort: 3,
    aliases: ['corrugated-pack', 'corrugated-cartons', '瓦楞包装', '瓦楞外箱'] }
];
const catKey = v => String(v || '').trim().toLowerCase();
// 这条分类是不是"产品线"那一层。空着没有下级的产品线也不算叶子，不能拿来挂商品。
function isLineRow(l, c) {
  return catKey(l.id) === catKey(c.id) || l.aliases.some(a => a === catKey(c.slug) || a === catKey(c.name));
}
// 原来这 13 种盒型是平的一层，按盒子本身的材料/工艺归到产品线下面。
// 识别顺序：先按 id，再按 slug，最后按中文名，兼容后台手工建过/改过名的分类。
const CAT_LINE_OF = {
  'CAT-01': 'CAT-L1-CARTON', 'CAT-02': 'CAT-L1-COLOUR', 'CAT-03': 'CAT-L1-COLOUR',
  'CAT-04': 'CAT-L1-PET', 'CAT-05': 'CAT-L1-CARTON', 'CAT-06': 'CAT-L1-PET',
  'CAT-07': 'CAT-L1-PET', 'CAT-08': 'CAT-L1-COLOUR', 'CAT-09': 'CAT-L1-COLOUR',
  'CAT-10': 'CAT-L1-COLOUR', 'CAT-11': 'CAT-L1-COLOUR', 'CAT-12': 'CAT-L1-COLOUR',
  'CAT-13': 'CAT-L1-CARTON'
};
// slug 这一层比中文名稳（名字被他改过也还认得出来）
const CAT_LINE_BY_SLUG = {
  'mailer-box': 'CAT-L1-CARTON', 'shipping-box': 'CAT-L1-CARTON', 'pos-display': 'CAT-L1-CARTON',
  'handle-box': 'CAT-L1-PET', 'cake-box': 'CAT-L1-PET', 'food-box': 'CAT-L1-PET',
  'sleeve-box': 'CAT-L1-COLOUR', 'lid-base-box': 'CAT-L1-COLOUR', 'paper-bag': 'CAT-L1-COLOUR',
  'date-box': 'CAT-L1-COLOUR', 'wine-box': 'CAT-L1-COLOUR', 'tuck-end-box': 'CAT-L1-COLOUR', 'rigid-box': 'CAT-L1-COLOUR'
};
const CAT_LINE_BY_NAME = {
  '飞机盒': 'CAT-L1-CARTON', '彩色运输盒': 'CAT-L1-CARTON', 'POS展示架': 'CAT-L1-CARTON',
  '手提盒': 'CAT-L1-PET', '蛋糕盒': 'CAT-L1-PET', '食品盒': 'CAT-L1-PET',
  '套筒盒': 'CAT-L1-COLOUR', '天地盖': 'CAT-L1-COLOUR', '纸袋': 'CAT-L1-COLOUR',
  '椰枣盒': 'CAT-L1-COLOUR', '酒盒': 'CAT-L1-COLOUR', '插边盒': 'CAT-L1-COLOUR', '精装盒': 'CAT-L1-COLOUR'
};
function lineForCat(c) {
  return CAT_LINE_OF[String(c.id)]
    || CAT_LINE_BY_SLUG[catKey(c.slug)]
    || CAT_LINE_BY_NAME[String(c.name || '').trim()] || '';
}

// 旧数据的英文名一并补上：英文/马来文页那一栏空着就会退回显示中文，分类标签会出现中英混排。
// 只认得这 13 个盒型，认不出的不乱填。
const CAT_EN = {

const CAT_EN_BY_NAME = {
  '飞机盒': 'Mailer Box', '套筒盒': 'Sleeve Box', '天地盖': 'Lid and Base Box', '手提盒': 'Handle Box',
  '彩色运输盒': 'Colour Shipping Box', '蛋糕盒': 'Cake Box', '食品盒': 'Food Box', '纸袋': 'Paper Bag',

// 把已经存在于数据库/本机里的旧盒型挂到产品线下面。新建的种子自带 parent，所以这里只会动老数据。
// 产品线那一级优先用数据里已有的那一行（他自己建过的 pet-pack / color-print-pack / corrugated-pack），
// 实在没有才插一条 CAT_LINES 里的默认行，避免分类页凭空多出两组同名一级。
// 必须等 Sync.muted=false 之后调用，否则改动不会同步上云。
function migrateCategoriesToTwoLevels() {
  const cats = DM.get('categories');
  if (!cats.length) return 0;
  // 现在是三级表（行业 → 材质工艺 → 品名），层级由分类数据自己带着。
  // 这套两级时代的归级逻辑一旦跑起来会往表里插三条老产品线当一级，所以见到三级行就直接退出。
  if (cats.some(c => c.parent && cats.some(p => String(p.id) === String(c.parent) && p.parent))) return 0;
  let changed = 0;
  const lineIdOf = {};          // 规范产品线 id -> 数据里实际那一行的 id
  CAT_LINES.forEach(l => {
    const hit = cats.find(c => !c.parent && isLineRow(l, c));
    if (hit) { lineIdOf[l.id] = String(hit.id); return; }
    cats.push({ id: l.id, name: l.name, nameEn: l.nameEn, nameBm: l.nameBm, parent: '', slug: l.slug, icon: l.icon, sort: l.sort, active: true });
    lineIdOf[l.id] = l.id;
    changed++;
  });
  const lineIds = new Set(Object.values(lineIdOf));
  cats.forEach(c => {
    if (lineIds.has(String(c.id))) return;
    if (!c.nameEn) {
      const en = CAT_EN[String(c.id)] || CAT_EN_BY_NAME[String(c.name || '').trim()];
      if (en) { c.nameEn = en; changed++; }
    }
    if (c.parent || catChildren(c.id, cats).length) return;
    const canon = lineForCat(c);
    if (!canon || !lineIdOf[canon]) return;   // 认不出产品线的新分类不乱挂，留给他自己选
    c.parent = lineIdOf[canon];
    changed++;
  });
  if (changed) DM.set('categories', cats);
  return changed;
}

// 展开状态只是这台电脑上的浏览偏好，故意用独立 key 存，不进 jl_ 前缀、不参与云同步
const CAT_TREE_KEY = 'cat_tree_open';
function catTreeOpen() { try { const a = JSON.parse(localStorage.getItem(CAT_TREE_KEY)); return new Set(Array.isArray(a) ? a.map(String) : []) } catch { return new Set() } }
function catTreeSave(set) { try { localStorage.setItem(CAT_TREE_KEY, JSON.stringify([...set])) } catch (e) {} }
function toggleCatNode(id) {
  if (!catChildren(id, DM.get('categories')).length) return;
  const s = catTreeOpen();
  s.has(String(id)) ? s.delete(String(id)) : s.add(String(id));
  catTreeSave(s); renderPage(currentPageId);
}
function expandAllCats() {
  const cats = DM.get('categories');
  catTreeSave(new Set(cats.filter(x => catChildren(x.id, cats).length).map(x => String(x.id))));
  renderPage(currentPageId);
}
function collapseAllCats() { catTreeSave(new Set()); renderPage(currentPageId); }
// 新建/改上级之后把这条的整条祖先链展开，否则它会藏在收起来的父级下面看不见
function revealCatBranch(parentId) {
  if (!parentId) return;
  const cats = DM.get('categories');
  const s = catTreeOpen();
  for (let cur = parentId, guard = 0; cur && guard++ < 6;) {
    s.add(String(cur));
    const node = cats.find(x => String(x.id) === String(cur));
    cur = node ? node.parent : '';
  }
  catTreeSave(s);
}

function renderCategories(c) {
  const cats = DM.get('categories');
  const products = DM.get('products');
  const nProducts = id => products.filter(p => String(p.categoryId || '') === String(id)).length;
  const tops = cats.filter(x => !x.parent).sort(byCatSort);
  const orphans = cats.filter(x => x.parent && !cats.some(t => String(t.id) === String(x.parent))).sort(byCatSort);
  const loose = tops.filter(t => !catChildren(t.id, cats).length && !isCatLine(t));
  const openSet = catTreeOpen();
  const rowsOf = (cat, depth) => {
    const kids = catChildren(cat.id, cats).sort(byCatSort);
    const id = String(cat.id);
    const on = openSet.has(id);
    const leafCount = () => { let n = 0; (function walk(x) { const ks = catChildren(x.id, cats); ks.length ? ks.forEach(walk) : n++; })(cat); return n; };
    const count = kids.length ? (() => { let n = 0; (function walk(x) { n += nProducts(x.id); catChildren(x.id, cats).forEach(walk); })(cat); return n; })() : nProducts(cat.id);
    const lv = ['一级 · 行业', '二级 · 材质工艺', '三级 · 品名'][Math.min(depth, 2)];
    const caret = kids.length
      ? `<button class="cat-caret" title="${on ? '收起' : '展开'}这 ${kids.length} 个子分类" onclick="event.stopPropagation();toggleCatNode('${id}')">${on ? '▾' : '▸'}</button>`
      : '<span class="cat-caret cat-caret-leaf" title="最末一级，下面没有子分类">·</span>';
    return `<tr class="cat-l${Math.min(depth + 1, 3)}">
      <td>${esc(cat.sort)}</td>
      <td>${esc(cat.icon)}</td>
      <td class="td-name" style="padding-left:${16 + depth * 24}px">${caret}${depth ? `<span style="color:var(--gray-400)">${depth > 1 ? '└─' : '└'}</span> ` : ''}<button class="cat-name-btn"${kids.length ? ` onclick="toggleCatNode('${id}')"` : ''}>${depth ? '' : '<b>'}${esc(cat.name)}${depth ? '' : '</b>'}</button> <span class="badge ${['badge-blue', 'badge-purple', 'badge-green'][Math.min(depth, 2)]}">${lv}</span>${kids.length ? ` <span class="text-sm text-gray">${on ? `${kids.length} 个子分类 · ${leafCount()} 个末级` : `点开看 ${kids.length} 个子分类（共 ${leafCount()} 个末级）`}</span>` : ''}${cat.active === false ? ' <span class="text-sm" style="color:var(--orange-600)">（未开放）</span>' : ''}</td>
      <td>${esc(cat.nameEn || '')}</td>
      <td>${esc(cat.nameBm || '')}</td>
      <td>${cat.image ? `<img src="${esc(cat.image)}" style="width:52px;height:38px;object-fit:cover;border-radius:4px;background:var(--gray-100)" alt="">` : '<span class="text-gray">—</span>'}</td>
      <td>${count ? count + ' 个商品' : '<span class="text-gray">—</span>'}</td>
      <td>${cat.active !== false ? '<span class="badge badge-green">上架</span>' : '<span class="badge badge-gray">下架</span>'}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="openCategoryModal('${cat.id}')">编辑</button> ${depth <= 1 ? `<button class="btn btn-sm btn-secondary" onclick="openCategoryModal(null,'${cat.id}')">+子级</button>` : ''} <button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat.id}')">删除</button></td>
    </tr>` + (on ? kids.map(k => rowsOf(k, depth + 1)).join('') : '');
  };
  const midCount = cats.filter(x => x.parent && catChildren(x.id, cats).length).length;
  const leafTotal = cats.filter(x => x.parent && !catChildren(x.id, cats).length).length;
  const anyOpen = openSet.size > 0;
  c.innerHTML = `
    <div class="page-header"><div><h1 class="page-title">商品分类</h1><p class="page-desc">三级：一级行业 → 二级材质工艺 → 三级品名，商品挂在最末一级。这张表默认折叠，一行一个分类，点名称左边的 ▸ 才展开下一层</p></div><button class="btn btn-primary" onclick="openCategoryModal()">+ 新建分类</button></div>
    <div class="card"><div class="card-body" style="padding:14px 16px;font-size:13px;color:var(--gray-600);line-height:1.7">
      前台读的是这里的<b>最末一级</b>：首页「产品中心」一个行业一张卡，访客点行业卡弹出这个行业的窗口，<b>窗口顶部那一整行文字</b>就是这个行业的「名称 + 说明」（没有图），中间那排分类标签就是<b>这个行业下面挂了在售商品的材质工艺</b>（最前面多一项「全部产品」），点标签切换下面那批商品；<b>只有挂了在售商品的分类才会出现</b>，同一行业下凑不出两条这样的分类，这一排就不显示。访客再点其中任意一张商品卡，会在上面<b>再盖一层商品详情</b>（左边商品大图、右边名称+说明+价格/起订量），关掉回到刚才那份列表。<br>
      这张表同时是报价单 / 线索 / 刀模里那个「盒型」下拉的选项库。<b>English 一栏留空的话，英文页和马来文页会显示中文分类名</b>，所以每个分类都建议填上英文。<br>
      「说明」分中 / 英 / 马来三栏，是这一类的介绍文案：前台访客在当前语言下看到的那段商品说明就是这里对应的那一栏（这次导入是按每个末级分类各建一条商品，把这三栏分别写进那条商品的中 / 英 / 马来描述）。<b>一级（行业）那几条的「说明」现在也已经填了草稿</b>，它出现在两个地方：首页那张行业卡上的小字、行业窗口顶部的大标题下面那行小字，改一处两处一起变；留空则那一行自己藏掉。想单独改某个商品在前台显示的文字，去「商品列表」编辑那条商品；「代表性产品」只有后台看得到；「封面图」点编辑上传，走云存储 jl-uploads 桶——<b>行业这一层的封面图只用在首页那张行业卡上</b>，行业窗口顶部已经不摆图了。
      ${loose.length ? `<br><span style="color:var(--orange-600)">现在还有 ${loose.length} 个分类既没有上级、下面也没有子分类（${loose.map(x => x.name).join('、')}）：它们目前仍然可以直接挂商品，也仍然出现在盒型下拉里。要归到某个行业下面，点它的「编辑」选上级。</span>` : ''}
    </div></div>
    <div class="card">
      <div class="cat-bar">
        <span>共 <b>${tops.length}</b> 个行业 · <b>${midCount}</b> 个材质工艺 · <b>${leafTotal}</b> 个末级品名</span>
        <button class="btn btn-sm btn-secondary" onclick="expandAllCats()">全部展开</button>
        <button class="btn btn-sm btn-secondary" onclick="collapseAllCats()">全部收起</button>
        <span style="margin-left:auto">${anyOpen ? '展开到哪一层只记在这台电脑上，刷新还在' : '默认只列一级行业，点名称左边的 ▸ 逐层往下展开'}</span>
      </div>
      <div class="table-wrap"><table><thead><tr><th>排序</th><th>图标</th><th>分类名称（中文）</th><th>English</th><th>Bahasa Malaysia</th><th>封面</th><th>商品</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${tops.map(t => rowsOf(t, 0)).join('')}${orphans.length ? `<tr><td colspan="9" style="padding:10px 16px;color:var(--gray-500);background:var(--gray-50)">下面这些分类的上级已经被删掉了，请重新选一个上级</td></tr>` + orphans.map(x => rowsOf(x, 1)).join('') : ''}</tbody></table></div></div>`;
}

function openCategoryModal(id, preParent) {
  const cats = DM.get('categories');
  const cat = id ? cats.find(x => String(x.id) === String(id)) : null;
  const title = cat ? '编辑分类' : '新建分类';
  const depthOf = x => { let d = 0, cur = x; while (cur && cur.parent) { cur = cats.find(y => String(y.id) === String(cur.parent)); d++; } return d; };
  const heightOf = x => { const kids = catChildren(x.id, cats); return kids.length ? 1 + Math.max(...kids.map(heightOf)) : 0; };
  const pathOf = x => { const p = []; let cur = x; while (cur) { p.unshift(cur.name); cur = cats.find(y => String(y.id) === String(cur.parent)); } return p.join(' › '); };
  // 只有自己和「自己下面的行」不能当上级（会成环）；往上的祖先恰恰是当前的上级，必须留着
  const desc = new Set();
  if (cat) { (function walk(pid) { catChildren(pid, cats).forEach(k => { desc.add(String(k.id)); walk(k.id); }); })(cat.id); }
  const cand = [];
  (function walk(node) {
    if (node && depthOf(node) <= 1 && (!cat || (String(node.id) !== String(cat.id) && !desc.has(String(node.id)) && depthOf(node) + 1 + heightOf(cat) <= 2))) cand.push(node);
    catChildren(node ? node.id : '', cats).sort(byCatSort).forEach(walk);
  })(null);
  const curParent = cat ? String(cat.parent || '') : String(preParent || '');
  // 上级行不在候选里时也要留在下拉里（编辑时能选回原样、+子级时能被明确拒绝），否则一保存就把这行悄悄提成了一级
  if (curParent && !cand.some(t => String(t.id) === curParent)) {
    const p = cats.find(x => String(x.id) === curParent);
    if (p) cand.push(p);
  }
  showModal(title, `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">上级分类</label><select class="form-select" id="f_parent">
        <option value="">（不选 = 作为一级行业）</option>
        ${cand.map(t => `<option value="${esc(t.id)}"${curParent === String(t.id) ? ' selected' : ''}>${esc(pathOf(t))}</option>`).join('')}
      </select></div>
      <div class="form-group"><label class="form-label">名称（中文）*</label><input class="form-input" id="f_name" value="${esc(cat?.name || '')}" placeholder="例如 生鲜果蔬包装 / PET包装 / 浆果盒"></div>
      <div class="form-group"><label class="form-label">名称（English）</label><input class="form-input" id="f_nameEn" value="${esc(cat?.nameEn || '')}" placeholder="e.g. Berry Clamshell"></div>
      <div class="form-group"><label class="form-label">名称（Bahasa Malaysia）</label><input class="form-input" id="f_nameBm" value="${esc(cat?.nameBm || '')}" placeholder="选填，留空则马来文页显示英文"></div>
      <div class="form-group"><label class="form-label">Slug</label><input class="form-input" id="f_slug" value="${esc(cat?.slug || '')}"></div>
      <div class="form-group"><label class="form-label">图标</label><input class="form-input" id="f_icon" value="${esc(cat?.icon || '')}" placeholder="一级二级建议放一个 emoji"></div>
      <div class="form-group"><label class="form-label">排序</label><input class="form-input" type="number" id="f_sort" value="${esc(cat?.sort || 1)}"></div>
      <div class="form-group"><label class="form-label">状态</label><select class="form-select" id="f_active">
        <option value="1"${cat && cat.active === false ? '' : ' selected'}>上架（前台可见）</option>
        <option value="0"${cat && cat.active === false ? ' selected' : ''}>下架</option>
      </select></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">说明（中文，前台中文页显示）</label><textarea class="form-input" id="f_cdesc" rows="3" placeholder="这一类适用于什么产品、有什么优势">${esc(cat?.desc || '')}</textarea></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">说明（English，前台英文页显示）</label><textarea class="form-input" id="f_cdescEn" rows="3" placeholder="英文页以这一栏为准，留空则英文页不显示这段说明">${esc(cat?.descEn || '')}</textarea></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">说明（Bahasa Malaysia，前台马来文页显示）</label><textarea class="form-input" id="f_cdescBm" rows="3" placeholder="留空则马来文页显示英文">${esc(cat?.descBm || '')}</textarea></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">代表性产品（每行一个）</label><textarea class="form-input" id="f_csamples" rows="4" placeholder="蓝莓盒125g&#10;草莓盒500g">${esc((cat?.samples || []).join('\n'))}</textarea></div>
      <div class="form-group full"><label class="form-label">封面图${cat?.image ? '（留空则保持不变）' : ''}</label><input class="form-input" type="file" accept="image/*" id="f_c_image"></div>
    </div>
    ${cat?.image ? `<div style="margin-top:12px;display:flex;align-items:center;gap:12px"><img src="${esc(cat.image)}" style="height:64px;max-width:200px;object-fit:cover;background:#fff;border:1px solid var(--gray-200);border-radius:6px;padding:4px"><label style="font-size:13px;color:var(--gray-600)"><input type="checkbox" id="f_c_clear_image"> 删除当前图片</label></div>` : ''}
  `, async () => {
    const name = val('f_name');
    if (!name) { toast('请填写分类名称'); return; }
    const parent = val('f_parent');
    let image = cat ? (cat.image || '') : '';
    let imagePath = cat ? (cat.imagePath || '') : '';
    if (document.getElementById('f_c_clear_image')?.checked) { image = ''; imagePath = ''; }
    const imgFile = document.getElementById('f_c_image')?.files?.[0];
    if (imgFile) {
      if (!Sync.ready) { toast('未连接后端数据库，无法上传图片'); return false; }
      toast('正在上传图片 …');
      const up = await cloudUpload(imgFile, 'categories');
      image = up.url; imagePath = up.path;
    }
    const data = {
      name,
      nameEn: val('f_nameEn'),
      nameBm: val('f_nameBm'),
      parent,
      slug: val('f_slug') || name.toLowerCase().replace(/\s+/g, '-'),
      icon: val('f_icon'),
      sort: parseInt(val('f_sort')) || 1,
      active: val('f_active') === '1',
      desc: val('f_cdesc'),
      descEn: val('f_cdescEn'),
      descBm: val('f_cdescBm'),
      samples: val('f_csamples').split(/[\n;；]/).map(x => x.trim()).filter(Boolean),
      image, imagePath
    };
    // 接上去之后最深不能超过三级（行业 → 材质工艺 → 品名）；下拉已过滤，这里兜住新建时直传 parent 的路径
    if (parent) {
      const pNode = cats.find(x => String(x.id) === String(parent));
      if (pNode && depthOf(pNode) + (cat ? heightOf(cat) : 0) > 1) {
        const kids = cat ? catChildren(cat.id, cats).length : 0;
        toast(cat && kids ? `「${cat.name}」下面还有 ${kids} 个分类，挂到「${pNode.name}」下面会超出三级。先把下面这些分类挪走或删掉。` : `「${pNode.name}」已经在最末一级了，下面不能再挂分类（本站只到三级）。`);
        return;
      }
    }
    let syncedTo = '';
    if (cat) {
      Object.assign(cat, data);
      // 编辑分类 = 以分类这一侧为准，把名称/说明/封面图推到配对主商品上
      const prods = DM.get('products');
      if (syncCatToProduct(cat, prods)) { DM.set('products', prods); syncedTo = '商品'; }
    } else {
      const newCat = Object.assign({ id: DM.genId('CAT') }, data);
      cats.push(newCat);
      // 新建分类时自动生成一条同名商品，继承分类名称和封面图，运营可直接在商品列表里改价格/起订量
      const products = DM.get('products');
      const newProd = {
        id: DM.genId('PRD'),
        name: data.nameEn || data.name,
        nameZh: data.name,
        nameBm: data.nameBm || '',
        categoryId: newCat.id,
        category: data.name,
        price: 0,
        moq: 0,
        moqUnit: 'pcs',
        status: 'active',
        image: data.image || '',
        imagePath: data.imagePath || '',
        desc: data.descEn || '',
        descZh: data.desc || '',
        descBm: data.descBm || ''
      };
      products.push(newProd);
      newCat.linkedProductId = newProd.id;
      DM.set('products', products);
      syncedTo = '商品';
    }
    DM.set('categories', cats);
    revealCatBranch(parent || preParent);
    toast(cat ? (syncedTo ? '分类已更新，并同步到对应商品' : '分类已更新（该分类下没有可配对的商品，未同步）')
              : '分类已创建，已自动生成对应商品');
    renderPage(currentPageId);
  });

  // 自动翻译：中文名称/描述失焦时，自动翻译成英文和马来文
  autoTranslateFromZh('f_name', 'f_nameEn', 'f_nameBm');
  autoTranslateFromZh('f_cdesc', 'f_cdescEn', 'f_cdescBm');
}

function deleteCategory(id) {
  const cats = DM.get('categories');
  const cat = cats.find(x => String(x.id) === String(id));
  if (!cat) return;
  const kids = catChildren(id, cats);
  if (kids.length) { toast(`「${cat.name}」下面还有 ${kids.length} 个子分类（${kids.map(k => k.name).join('、')}），先删掉它们或给它们改走上级`); return; }
  const used = DM.get('products').filter(p => String(p.categoryId || '') === String(id)).length;
  if (!confirm(used ? `「${cat.name}」下面挂着 ${used} 个商品。删除后这些商品会变成未分类（前台商品弹窗的分类标签里就不再出现这一类），需要重新编辑商品改分类。确定删除？` : `确定删除分类「${cat.name}」？`)) return;
  DM.set('categories', cats.filter(x => String(x.id) !== String(id)));
  toast('分类已删除'); renderPage(currentPageId);
}

// 商品列表筛选状态
let productFilter = { search: '', industry: '', category: '' };
// 折叠状态：记录哪些行业被折叠了
let collapsedIndustries = new Set();

// 找到分类的顶级行业（一级分类）
function getTopIndustry(catId, categories) {
  let current = categories.find(c => String(c.id) === String(catId));
  while (current && current.parent) {
    current = categories.find(c => String(c.id) === String(current.parent));
  }
  return current;
}

function renderProductsList(c) {
  const products = DM.get('products');
  const categories = DM.get('categories');
  // 收集所有出现过的分类（去重，按名称排序）
  const catSet = new Map();
  products.forEach(p => { if (p.category) catSet.set(p.category, p.category); });
  const catList = [...catSet.values()].sort((a, b) => a.localeCompare(b, 'zh'));

  // 按行业分组
  const industryGroups = new Map();
  products.forEach(p => {
    const industry = getTopIndustry(p.categoryId, categories);
    const industryName = industry ? (industry.name || industry.nameEn || '未分类') : '未分类';
    if (!industryGroups.has(industryName)) industryGroups.set(industryName, []);
    industryGroups.get(industryName).push(p);
  });
  // 收集行业列表（用于下拉菜单）
  const industryList = [...new Set([...industryGroups.keys()])].sort((a, b) => a.localeCompare(b, 'zh'));

  // 按行业名称排序
  const sortedIndustries = [...industryGroups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh'));

  c.innerHTML = `
    <div class="page-header"><div><h1 class="page-title">商品列表</h1><p class="page-desc">管理所有产品</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="openProductModal()">+ 新建商品</button></div></div>
    <div class="card" style="padding:16px 20px;margin-bottom:16px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <input type="text" id="productSearch" class="form-input" placeholder="搜索商品名称..." value="${esc(productFilter.search)}" style="flex:1;min-width:200px;max-width:320px">
        <select id="productIndustryFilter" class="form-select" style="min-width:160px">
          <option value="">全部行业</option>
          ${industryList.map(ind => `<option value="${esc(ind)}" ${productFilter.industry===ind?'selected':''}>${esc(ind)}</option>`).join('')}
        </select>
        <select id="productCategoryFilter" class="form-select" style="min-width:180px">
          <option value="">全部分类</option>
          ${catList.map(cat => `<option value="${esc(cat)}" ${productFilter.category===cat?'selected':''}>${esc(cat)}</option>`).join('')}
        </select>
        <button class="btn btn-sm btn-secondary" onclick="productFilter={search:'',industry:'',category:''};renderPage(currentPageId)">重置</button>
      </div>
    </div>
    ${sortedIndustries.map(([industryName, prods]) => {
      const isCollapsed = collapsedIndustries.has(industryName);
      // 应用筛选
      let filtered = prods;
      if (productFilter.industry && industryName !== productFilter.industry) {
        filtered = [];
      }
      if (productFilter.search) {
        const q = productFilter.search.toLowerCase();
        filtered = filtered.filter(p => (p.name||'').toLowerCase().includes(q) || (p.nameZh||'').toLowerCase().includes(q) || (p.nameBm||'').toLowerCase().includes(q));
      }
      if (productFilter.category) {
        filtered = filtered.filter(p => p.category === productFilter.category);
      }
      filtered.sort((a, b) => (Number(a.sort) || 0) - (Number(b.sort) || 0));
      return `
        <div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;user-select:none" onclick="toggleIndustryCollapse('${esc(industryName)}')">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:18px;transition:transform 0.2s;transform:rotate(${isCollapsed?'-90':'0'}deg)">▼</span>
              <strong style="font-size:15px">${esc(industryName)}</strong>
              <span style="font-size:13px;color:var(--gray-500)">(${filtered.length} 件商品)</span>
            </div>
          </div>
          ${!isCollapsed ? `<div class="table-wrap"><table><thead><tr><th>排序</th><th>名称</th><th>分类</th><th>起步价</th><th>MOQ</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>${filtered.length === 0 ? '<tr><td colspan="7" style="text-align:center;padding:24px;color:#999">没有匹配的商品</td></tr>' :
          filtered.map(p=>`<tr><td>${Number(p.sort)||0}</td><td class="td-name">${esc(p.name)}</td><td>${esc(p.category)}</td><td>RM ${p.price.toFixed(2)}</td><td>${esc(p.moq)} ${p.moqUnit}</td><td>${p.status==='active'?'<span class="badge badge-green">上架</span>':'<span class="badge badge-gray">下架</span>'}</td><td><button class="btn btn-sm btn-secondary" onclick="openProductModal('${p.id}')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>` : ''}
        </div>
      `;
    }).join('')}
  `;

  // 绑定筛选事件
  document.getElementById('productSearch')?.addEventListener('input', e => {
    productFilter.search = e.target.value;
    renderProductsList(c);
  });
  document.getElementById('productIndustryFilter')?.addEventListener('change', e => {
    productFilter.industry = e.target.value;
    renderProductsList(c);
  });
  document.getElementById('productCategoryFilter')?.addEventListener('change', e => {
    productFilter.category = e.target.value;
    renderProductsList(c);
  });
}

function toggleIndustryCollapse(industryName) {
  if (collapsedIndustries.has(industryName)) {
    collapsedIndustries.delete(industryName);
  } else {
    collapsedIndustries.add(industryName);
  }
  renderPage(currentPageId);
}

      </select></div>

      <div class="form-group" style="grid-column:span 2"><label class="form-label">商品描述（英文，前台英文页显示）</label><textarea class="form-input" id="f_desc" rows="3" placeholder="商品简短描述...">${esc(p?.desc||'')}</textarea></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">商品描述（中文）</label><textarea class="form-input" id="f_descZh" rows="3" placeholder="留空则中文页显示英文">${esc(p?.descZh||'')}</textarea></div>
      <div class="form-group" style="grid-column:span 2"><label class="form-label">商品描述（Bahasa Malaysia）</label><textarea class="form-input" id="f_descBm" rows="3" placeholder="留空则马来文页显示英文">${esc(p?.descBm||'')}</textarea></div>
      <div class="form-group full"><label class="form-label">商品图片${p?.image?'（留空则保持不变）':''}</label><input class="form-input" type="file" accept="image/*" id="f_p_image"></div>
    </div>
    ${p?.image?`<div style="margin-top:12px;display:flex;align-items:center;gap:12px"><img src="${esc(p.image)}" style="height:64px;max-width:200px;object-fit:cover;background:#fff;border:1px solid var(--gray-200);border-radius:6px;padding:4px"><label style="font-size:13px;color:var(--gray-600)"><input type="checkbox" id="f_p_clear_image"> 删除当前图片</label></div>`:''}
  `, async () => {
    const name = val('f_name');
    const categorySelect = document.getElementById('f_category');
    const categoryId = categorySelect.value;
    // 名称从分类表里反查，不读 option 的显示文字（那里可能带「（原分类已删除）」这种提示后缀）
    const categoryName = (categories.find(c => String(c.id) === String(categoryId)) || {}).name || (p ? p.category : '') || '';
    if (!name) { toast('请填写商品名称'); return; }
    if (!categoryId) { toast('请选择分类。行业和材质工艺那两级只用来分组，商品要挂到最末一级'); return; }

    let image = p ? (p.image || '') : '';
    let imagePath = p ? (p.imagePath || '') : '';
    if (document.getElementById('f_p_clear_image')?.checked) { image = ''; imagePath = ''; }
    const imgFile = document.getElementById('f_p_image')?.files?.[0];
    if (imgFile) {
      if (!Sync.ready) { toast('未连接后端数据库，无法上传图片'); return false; }
      toast('正在上传图片 …');
      const up = await cloudUpload(imgFile, 'product');
      image = up.url; imagePath = up.path;
    }

    let saved;
    if (p) {
      p.name = name;
      p.nameZh = val('f_nameZh');
      p.nameBm = val('f_nameBm');
      p.categoryId = categoryId;
      p.category = categoryName;
      p.price = parseFloat(val('f_price')) || 0;
      p.moq = parseInt(val('f_moq')) || 0;
      p.moqUnit = val('f_moqUnit');
      p.status = val('f_status');
      p.sort = parseInt(document.getElementById('f_sort').value) || 0;
      p.desc = val('f_desc');
      p.descZh = val('f_descZh');
      p.descBm = val('f_descBm');
      p.image = image;
      p.imagePath = imagePath;
      saved = p;
    } else {
      saved = {
        id: DM.genId('PRD'),
        name,
        nameZh: val('f_nameZh'),
        nameBm: val('f_nameBm'),
        categoryId,
        category: categoryName,
        price: parseFloat(val('f_price')) || 0,
        moq: parseInt(val('f_moq')) || 0,
        moqUnit: val('f_moqUnit'),
        status: val('f_status'),
        sort: parseInt(document.getElementById('f_sort').value) || 0,
        image,
        imagePath,
        desc: val('f_desc'),
        descZh: val('f_descZh'),
        descBm: val('f_descBm')
      };
      products.push(saved);
    }
    // 商品 → 分类：只有这条商品是所选分类的配对主商品时才回写，
    // 你另外手动多加的同类商品不会把分类文案顶掉
    const wroteBack = syncProductToCat(saved, categories, products);
    if (wroteBack) DM.set('categories', categories);
    DM.set('products', products);
    toast((p ? '商品已更新' : '商品已创建') + (wroteBack ? '，并同步到分类' : ''));
    renderPage(currentPageId);
  });

  // 自动翻译：中文名称/描述失焦时，自动翻译成英文和马来文
  autoTranslateFromZh('f_nameZh', 'f_name', 'f_nameBm');
  autoTranslateFromZh('f_descZh', 'f_desc', 'f_descBm');
}

async function saveBannerBg(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const up = await cloudUpload(file, 'branding');
    const b = docVal('settings_banner');
    b.bg = up.url;
    b.bgPath = up.path;
    DM.set('settings_banner', b);
    const box = document.getElementById('fs_banner_bg_box');
    if (box) box.innerHTML = `<img src="${safeHref(up.url)}" alt="背景图" style="max-height:120px;max-width:100%;border:1px solid var(--gray-200);border-radius:6px;object-fit:cover"> <button class="btn btn-sm btn-secondary" onclick="removeBannerBg()">移除</button>`;
    toast('背景图已上传，保存文字后一起生效');
  } catch (e) {
    toast('背景图上传失败：' + e.message);
    input.value = '';
  }
}

function removeBannerBg() {
  const b = docVal('settings_banner');
  // 写空串而不是删键：拉取时按字段合并，删掉的键会被本机旧值补回来，等于移除无效
  b.bg = '';
  b.bgPath = '';
  DM.set('settings_banner', b);
  toast('已移除背景图，前台恢复默认背景');
  renderPage(currentPageId);
}

// 首屏轮播图存在 settings_banner.slides 里，和商品列表无关。
// 拉取时按顶层字段合并，所以每次改动都要把整份数组写回去，不能只补一条。
function slideList() {
  const b = docVal('settings_banner');
  return Array.isArray(b.slides) ? b.slides.filter(s => s && typeof s === 'object')
    .slice().sort((x, y) => (Number(x.sort) || 0) - (Number(y.sort) || 0)) : [];
}

function saveSlides(arr) {
  const b = docVal('settings_banner');
  // 顺序号按当前行重编（1 起），前台就按这个数排
  b.slides = arr.map((s, i) => Object.assign({}, s, { sort: i + 1 }));
  DM.set('settings_banner', b);
  renderPage(currentPageId);
}

// 跳转链接只放行 http(s) 网址和页内锚点，别的伪协议（javascript: 等）当场拒掉
function slideHref(v) {
  const s = String(v || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s) || /^#[\w-]+$/.test(s)) return s;
  return null;
}

async function addSlides(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  if (!Sync.ready) { toast('未连接后端数据库，无法上传图片'); input.value = ''; return; }
  const arr = slideList();
  const before = arr.length;
  let failed = 0;
  for (let i = 0; i < files.length; i++) {
    toast(`正在上传第 ${i + 1}/${files.length} 张 …`);
    try {
      const up = await cloudUpload(files[i], 'hero');
      arr.push({ id: DM.genId('SL'), img: up.url, imgPath: up.path, cap: '', capZh: '', capBm: '', href: '', active: true, sort: 0 });
    } catch (e) { failed++; }
  }
  input.value = '';
  if (arr.length === before) { toast(failed ? '图片上传失败：' + failed + ' 张' : '没有选中图片'); return; }
  saveSlides(arr);
  toast(failed ? `已添加 ${arr.length - before} 张，${failed} 张上传失败` : `已添加 ${arr.length - before} 张轮播图`);
}

function openSlideModal(i) {
  const arr = slideList();
  const s = arr[i];
  if (!s) return;
  showModal('编辑轮播图 第 ' + (i + 1) + ' 张', `
    <div class="form-grid">
      <div class="form-group full">${s.img ? `<label class="form-label">当前图片</label><img src="${safeHref(s.img)}" alt="" style="width:100%;max-height:200px;object-fit:cover;border:1px solid var(--gray-200);border-radius:6px;margin-bottom:8px">` : ''}<label class="form-label">换一张（不选就保持原图）</label><input class="form-input" type="file" accept="image/*" id="f_s_image"></div>
      <div class="form-group full"><label class="form-label">左下角文字（英文）</label><input class="form-input" id="f_s_cap" value="${esc(s.cap || '')}" placeholder="留空则图片上不叠字"></div>
      <div class="form-group full"><label class="form-label">左下角文字（中文）</label><input class="form-input" id="f_s_capZh" value="${esc(s.capZh || '')}" placeholder="留空则中文页显示英文"></div>
      <div class="form-group full"><label class="form-label">左下角文字（Bahasa Malaysia）</label><input class="form-input" id="f_s_capBm" value="${esc(s.capBm || '')}" placeholder="留空则马来文页显示英文"></div>
      <div class="form-group full"><label class="form-label">点击跳转<small style="font-weight:400;color:var(--gray-500)">（选填，只能填 http(s) 网址或 #页内锚点）</small></label><input class="form-input" id="f_s_href" value="${esc(s.href || '')}" placeholder="https://… 或 #products"></div>
      <div class="form-group full"><label style="font-size:13px"><input type="checkbox" id="f_s_active" ${s.active === false ? '' : 'checked'}> 在首页轮播（取消勾选 = 先留着不上线）</label></div>
    </div>
  `, async () => {
    const href = slideHref(val('f_s_href'));
    if (href === null) { toast('跳转链接只支持 http(s) 网址或 #页内锚点'); return false; }
    const file = document.getElementById('f_s_image')?.files?.[0];
    if (file) {
      if (!Sync.ready) { toast('未连接后端数据库，无法上传图片'); return false; }
      toast('正在上传图片 …');
      const up = await cloudUpload(file, 'hero');
      s.img = up.url; s.imgPath = up.path;
    }
    s.cap = val('f_s_cap');
    s.capZh = val('f_s_capZh');
    s.capBm = val('f_s_capBm');
    s.href = href;
    s.active = document.getElementById('f_s_active').checked;
    arr[i] = s;
    saveSlides(arr);
    toast('轮播图已更新');
  });
}

function moveSlide(i, dir) {
  const arr = slideList();
  const j = i + dir;
  if (!arr[i] || !arr[j]) return;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  saveSlides(arr);
  toast('顺序已调整');
}

function toggleSlide(i) {
  const arr = slideList();
  if (!arr[i]) return;
  arr[i].active = arr[i].active === false;
  saveSlides(arr);
  toast(arr[i].active ? '已启用，前台会轮播这张' : '已停用，前台不再轮播这张');
}

function deleteSlide(i) {
  const arr = slideList();
  if (!arr[i]) return;
  if (!confirm('确定删除这张轮播图？')) return;
  arr.splice(i, 1);
  saveSlides(arr);
  toast('轮播图已删除');
}

async function saveAboutPoster(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const up = await cloudUpload(file, 'branding');
    const s = docVal('settings_about');
    s.videoPoster = up.url;
    s.videoPosterPath = up.path;
    DM.set('settings_about', s);
    paintAboutPoster();
    toast('封面图已上传，保存文字后一起生效');
  } catch (e) {
    toast('封面图上传失败：' + e.message);
    input.value = '';
  }
}

function removeAboutPoster() {
  const s = docVal('settings_about');
  // 写空串而不是删键：拉取时按字段合并，删掉的键会被本机旧值补回来，等于移除无效
  s.videoPoster = '';
  s.videoPosterPath = '';
  DM.set('settings_about', s);
  paintAboutPoster();
  toast('已移除封面图，前台恢复橙色占位块');
}

function paintAboutPoster() {
  const box = document.getElementById('fs_about_video_poster_box');
  if (!box) return;
  const poster = docVal('settings_about').videoPoster || '';
  box.innerHTML = poster
    ? `<img src="${safeHref(poster)}" alt="视频封面图" style="max-height:140px;max-width:100%;border:1px solid var(--gray-200);border-radius:6px;object-fit:cover"> <button class="btn btn-sm btn-secondary" onclick="removeAboutPoster()">移除</button>`
    : '<span style="font-size:12px;color:var(--gray-500)">未上传，前台保持原来的橙色占位块</span>';
}

async function saveCbImage(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const up = await cloudUpload(file, 'products');
    const s = docVal('settings_about');
    s.cbImage = up.url;
    s.cbImagePath = up.path;
    DM.set('settings_about', s);
    paintCbImage();
    toast('产品组合图已上传，保存文字后一起生效');
  } catch (e) {
    toast('上传失败：' + e.message);
    input.value = '';
  }
}

function removeCbImage() {
  const s = docVal('settings_about');
  // 写空串而不是删键：拉取时按字段合并，删掉的键会被本机旧值补回来，等于移除无效
  s.cbImage = '';
  s.cbImagePath = '';
  DM.set('settings_about', s);
  paintCbImage();
  toast('已移除产品组合图，前台弹窗只显示文字介绍');
}

function paintCbImage() {
  const box = document.getElementById('cb_img_box');
  if (!box) return;
  const img = docVal('settings_about').cbImage || '';
  box.innerHTML = img
    ? `<img src="${safeHref(img)}" alt="产品组合图" style="max-height:200px;max-width:100%;border:1px solid var(--gray-200);border-radius:6px;object-fit:contain"> <button class="btn btn-sm btn-secondary" onclick="removeCbImage()">移除</button>`

let mediaSearch = '', mediaTypeFilter = '';

function mediaGridHtml(files) {
  if (!files.length) return `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">暂无文件</div>`;
  return files.map(f=>`<div style="border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;cursor:pointer" onclick="viewMediaFile('${f.id}')">${f.url && f.type==='image' ? `<img src="${safeHref(f.url)}" loading="lazy" style="width:100%;height:100px;object-fit:cover;display:block">` : `<div style="height:100px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:24px">${f.type==='image'?'🖼️':f.type==='pdf'?'📄':'📁'}</div>`}<div style="padding:8px;font-size:11px;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div></div>`).join('');
}

function applyMediaFilter() {
  const grid = document.getElementById('mediaGrid');
  if (!grid) return;
  let files = DM.get('mediaFiles');
  if (mediaSearch) files = files.filter(f => f.name.toLowerCase().includes(mediaSearch));
  if (mediaTypeFilter) files = files.filter(f => f.type === mediaTypeFilter);
  grid.innerHTML = mediaGridHtml(files);
}

function filterMedia(v) { mediaSearch = (v||'').toLowerCase(); applyMediaFilter(); }
function filterMediaType(v) { mediaTypeFilter = v||''; applyMediaFilter(); }

function openMediaUpload() {
  showModal('上传文件', `
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">选择文件 *</label><input class="form-input" type="file" id="f_media_file"></div>
      <div class="form-group"><label class="form-label">文件分类</label><select class="form-select" id="f_media_type"><option value="image">图片</option><option value="pdf">PDF</option><option value="other">其他</option></select></div>
      <div class="form-group"><label class="form-label">备注名称</label><input class="form-input" id="f_media_name" placeholder="可选，留空使用文件名"></div>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--gray-50);border-radius:6px;font-size:12px;color:var(--gray-500)">文件上传后存放在云端，所有同事和官网都能直接访问。单个文件上限 20MB。</div>
  `, async () => {
    const fileInput = document.getElementById('f_media_file');
    const file = fileInput?.files?.[0];

    const type = val('f_media_type');

      const up = await cloudUpload(file, 'media');

function editCaseCategory(idx) {
  const cats = DM.get('caseCategories');
  const old = cats[idx];
  if (old === undefined) return;
  showModal('编辑分类', `
    <div class="form-group"><label class="form-label">分类名称</label><input class="form-input" id="f_casecat_edit" value="${esc(old)}"></div>

  `, () => {
    const name = val('f_casecat_edit');
    if (!name) { toast('请输入名称'); return; }
    const list = DM.get('caseCategories');
    if (list[idx] === undefined) { toast('分类已变动，请重新打开'); return; }
    list[idx] = name;
    DM.set('caseCategories', list);
    toast('分类已更新'); renderPage(currentPageId);
  });

function deleteCaseCategory(idx) {
  const cats = DM.get('caseCategories');
  const name = cats[idx];
  if (name === undefined) { toast('分类已变动，请刷新页面'); return; }

  cats.splice(idx, 1);
  DM.set('caseCategories', cats);
  toast('已删除'); closeModal(); renderPage(currentPageId);
}

  const sel = document.getElementById('h5_product');

// 按行业重建商品下拉；已选中的商品即使不在当前行业里也保留，防止误改行业就丢关联
function h5FilterProducts() {
  const sel = document.getElementById('h5_product');
  if (!sel) return;
  const data = sel._prodData || [];
  const ind = (document.getElementById('h5_industry') || {}).value || '';
  const cur = sel.value || '';
  let rows = data.filter(x => !ind || x.industry === ind);
  if (cur && !rows.some(x => x.id === cur)) { const keep = data.find(x => x.id === cur); if (keep) rows = [keep, ...rows]; }
  sel.innerHTML = '<option value="">— 手动填图，不关联商品 —</option>' + rows.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  if (cur) sel.value = cur;
}

  const p = DM.get('products', []).find(x => String(x.id) === String(pid));

function h5Preview(url) {
  const prev = document.getElementById('h5_coverPrev');

function saveSettingsH5() {
  const rowArr = (tc, dc, tk, dk, extra) => {
    const t = {}, dd = {};
    document.querySelectorAll('.'+tc).forEach(el => t[el.dataset.idx] = el.value);
    document.querySelectorAll('.'+dc).forEach(el => dd[el.dataset.idx] = el.value);
    const n = Math.max(Object.keys(t).length, Object.keys(dd).length);
    const out = [];
    for (let i=0;i<n;i++) {
      const o = {}; o[tk]=t[i]||''; o[dk]=dd[i]||'';
      if (extra) { const e = {}; document.querySelectorAll('.'+extra.c).forEach(el => e[el.dataset.idx]=el.value); o[extra.k]=e[i]||''; }
      out.push(o);
    }
    return out;
  };
  const pid = val('h5_product');
  DM.set('settings_h5', {
    productId: pid,
    coverEyebrow:val('h5_coverEyebrow'), coverTitle:val('h5_coverTitle'), coverLead:val('h5_coverLead'), coverImage:val('h5_coverImage'),
    painEyebrow:val('h5_painEyebrow'), painTitle:val('h5_painTitle'),
    pain: rowArr('h5-pt','h5-pd','t','d'),
    featEyebrow:val('h5_featEyebrow'), featTitle:val('h5_featTitle'),
    feat: rowArr('h5-ft','h5-fd','t','d',{c:'h5-fc',k:'ic'}),
    specEyebrow:val('h5_specEyebrow'), specTitle:val('h5_specTitle'), specLead:val('h5_specLead'),
    spec: rowArr('h5-sk','h5-sv','k','v'),
    trustEyebrow:val('h5_trustEyebrow'), trustTitle:val('h5_trustTitle'),
    stats: rowArr('h5-sn','h5-sl','n','l'),
    ctaEyebrow:val('h5_ctaEyebrow'), ctaTitle:val('h5_ctaTitle'), ctaLead:val('h5_ctaLead'),
    wa:val('h5_wa'), waMsg:val('h5_waMsg'), phone:val('h5_phone'), phoneLabel:val('h5_phoneLabel'),
    email:val('h5_email'), address:val('h5_address')
  });
  writeLog('保存 H5 推广页', 'productId='+pid);
  toast('H5 内容已保存并同步');
}

// 名单里的「待验证邮箱」由 Supabase 那边决定，本地看不到；但对方能登录成功就说明已经验证过了，
// 所以在本次登录时把这个标记翻掉，免得主管一直以为账号还没激活。
function markSelfConfirmed() {
  const me = Sync.user;
  if (!me || !me.email) return;
  const users = DM.get('users');
  const row = users.find(u => (u.email || '').toLowerCase() === String(me.email).toLowerCase());
  if (!row || !row.needsConfirm) return;
  row.needsConfirm = false;
  if (!row.active) row.active = true;
  DM.set('users', users);
}

// 「设计」这一档已改成「主管」（外勤那一摊归主管管），老数据里叫「设计」的角色和账号开机时统一换名。
// 只认精确等于「设计」的行，他自己改过名的不动。
function migrateRoleDesignerToSupervisor() {
  let changed = 0;
  const roles = DM.get('roles');
  roles.forEach(r => {
    if (String(r.name || '').trim() === '设计') {
      r.name = '主管';
      r.perms = ['外勤管理(全部)', '商品管理', '内容管理', '媒体库'];
      changed++;
    }
  });
  if (changed) DM.set('roles', roles);
  const users = DM.get('users');
  let uChanged = 0;
  users.forEach(u => { if (String(u.role || '').trim() === '设计') { u.role = '主管'; uChanged++ } });
  if (uChanged) DM.set('users', users);
  return changed + uChanged;
}

function deleteUser(id) {
  const users = DM.get('users');
  const u = users.find(x => x.id === id);
  if (!u) { toast('找不到这个账号'); return }
  const me = Sync.user && String(Sync.user.id) === String(u.id);
  if (!confirm(me ? `「${u.name}」就是你当前登录用的账号，确定把这条名单记录删掉？`
                  : `把「${u.name}」从管理员名单里移除？\n\n这只删名单记录。如果这个邮箱还能登录，请到 Supabase 控制台 Authentication → Users 里一并删除。`)) return;
  DM.set('users', users.filter(x => x.id !== id));

function val(id) { return document.getElementById(id)?.value?.trim() || '' }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function money2(n) { return (Number(n) || 0).toFixed(2) }

// ========== 自动翻译（MyMemory 免费 API，无需 key） ==========
// 中文输入框失焦时，自动把内容翻译成英文和马来文，填入对应字段
// 如果目标字段已有内容（用户手动改过），则不覆盖
async function translateText(text, targetLang) {
  if (!text || !text.trim()) return '';
  const langMap = { en: 'en-GB', ms: 'ms-MY' };
  const lang = langMap[targetLang] || targetLang;
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|${lang}`);
    const data = await res.json();
    if (data.responseStatus === 200 && data.responseData?.translatedText) {
      return data.responseData.translatedText;
    }
  } catch (e) {
    console.warn('翻译失败:', e);
  }
  return '';
}

async function autoTranslateFromZh(sourceId, targetEnId, targetBmId) {
  const source = document.getElementById(sourceId);
  const targetEn = document.getElementById(targetEnId);
  const targetBm = document.getElementById(targetBmId);
  if (!source || !targetEn || !targetBm) return;

  source.addEventListener('blur', async () => {
    const zhText = source.value.trim();
    if (!zhText) return;
    // 只在目标字段为空时才翻译，不覆盖用户手动填写的内容
    const tasks = [];
    if (!targetEn.value.trim()) {
      tasks.push(translateText(zhText, 'en').then(t => { if (t) targetEn.value = t; }));
    }
    if (!targetBm.value.trim()) {
      tasks.push(translateText(zhText, 'ms').then(t => { if (t) targetBm.value = t; }));
    }
    if (tasks.length) {
      source.style.opacity = '0.6';
      await Promise.all(tasks);
      source.style.opacity = '1';
    }
  });
}
// 云端地址是后台可编辑字段，挡掉 javascript: 这类伪协议，只放行 http(s) 和站内路径
function safeHref(u) {
  const s = String(u ?? '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return esc(s);
  if (s.indexOf('//') === 0) return '';
  if (s.split(/[?#]/)[0].split('/')[0].indexOf(':') !== -1) return '';
  return esc(s.replace(/ /g, '%20'));
}

function readCsvText(file) {
  return file.arrayBuffer().then(buf => {
    let text = new TextDecoder('utf-8', {fatal: false}).decode(buf);
    if (text.includes('\uFFFD')) text = new TextDecoder('gbk').decode(buf);
    return text;
  });
}

function parseDelimited(text) {
  const norm = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const first = norm.split('\n').find(l => l.trim()) || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < norm.length; i++) {
    const ch = norm[i];
    if (inQ) {
      if (ch === '"') { if (norm[i + 1] === '"') { cell += '"'; i++ } else inQ = false }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cell); cell = '' }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = '' }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

function applyPricebookCsv(text, defaultBox, pb) {
  const rows = parseDelimited(text);
  if (rows.length < 2) return {ok: false, msg: '文件至少要有表头和一行数据'};
  let hi = rows.findIndex(r => r.some(c => /sku|编号|型号|款号/i.test(c)));
  if (hi < 0) hi = 0;
  const head = rows[hi].map(h => h.toLowerCase());
  const digits = h => (h.match(/\d+/g) || []).join('');
  const find = re => head.findIndex(h => re.test(h));
  const cSku = find(/sku|编号|型号|款号/);
  const cSize = find(/尺寸|规格|size/);
  const cBox = find(/盒型|箱型|类型|box/);
  const tierCols = PB_TIERS.map(t => head.findIndex(h => digits(h) === t));
  if (tierCols.every(c => c < 0)) return {ok: false, msg: '没找到 100/300/500/1000/2000/3000/5000pcs 数量列'};
  const skuCol = cSku < 0 ? 0 : cSku;
  let added = 0, updated = 0, skipped = 0;
  const boxes = new Set();
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const sku = (r[skuCol] || '').trim();
    const box = ((cBox >= 0 && r[cBox]) ? r[cBox] : (defaultBox || '')).trim();
    if (!sku || !box) { skipped++; continue }
    pb[box] = pb[box] || [];
    const prices = tierCols.map(c => {
      if (c < 0) return '';
      const n = parseFloat(String(r[c] ?? '').replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? '' : n;
    });
    if (prices.every(p => p === '')) { skipped++; continue }
    let row = pb[box].find(x => String(x.sku).toLowerCase() === sku.toLowerCase());
    if (row) {
      row.p = row.p || PB_TIERS.map(() => '');
      if (cSize >= 0 && r[cSize]) row.size = r[cSize];
      prices.forEach((v, pi) => { if (v !== '') row.p[pi] = v });
      updated++;
    } else {
      pb[box].push({sku, size: cSize >= 0 ? (r[cSize] || '') : '', p: prices});
      added++;
    }
    boxes.add(box);
  }
  if (!added && !updated) return {ok: false, msg: '没有匹配到任何有效 SKU 行'};
  return {ok: true, pb, added, updated, skipped, total: rows.length - hi - 1, boxes: [...boxes]};
}

      <div class="form-group"><label class="form-label">选择 CSV 文件 *</label><input class="form-input" type="file" accept=".csv,.txt" id="f_pb_file"></div>

    <div style="margin-top:12px;padding:12px;background:var(--gray-50);border-radius:6px;font-size:12px;color:var(--gray-600)">
      <b>表头格式（列顺序任意，按名称自动识别）</b><br>
      SKU, 盒型, 尺寸, 100pcs, 300pcs, 500pcs, 1000pcs, 2000pcs, 3000pcs, 5000pcs<br>
      没有「盒型」列时全部导入到上面选中的盒型；已有 SKU 覆盖更新，新 SKU 自动追加。<br>
      Excel 请先「另存为 → CSV UTF-8 (逗号分隔)」。
    </div>
    <div id="pbPreview" style="margin-top:12px"></div>
  `, () => {
    const file = document.getElementById('f_pb_file')?.files?.[0];
    if (!file) { toast('请选择 CSV 文件'); return false }
    return readCsvText(file).then(text => {
      const r = applyPricebookCsv(text, val('f_pb_box'), docVal('pricebook'));
      if (!r.ok) { toast('导入失败：' + r.msg); return false }
      DM.set('pricebook', r.pb);
      toast('导入完成：新增 ' + r.added + ' 个 SKU，更新 ' + r.updated + ' 个' + (r.skipped ? '，跳过 ' + r.skipped + ' 行' : ''));
      pricebookTab = r.boxes[0] || pricebookTab;
      renderPage(currentPageId);
    });
  });
  document.getElementById('f_pb_file')?.addEventListener('change', previewPricebookImport);
}

function previewPricebookImport() {
  const el = document.getElementById('pbPreview');
  const file = document.getElementById('f_pb_file')?.files?.[0];
  if (!el || !file) return;
  el.innerHTML = '<div style="font-size:12px;color:var(--gray-500)">正在解析…</div>';
  readCsvText(file).then(text => {
    const r = applyPricebookCsv(text, val('f_pb_box'), JSON.parse(JSON.stringify(docVal('pricebook'))));
    el.innerHTML = r.ok
      ? `<div style="padding:10px;background:#f6ffed;color:#135200;border-radius:6px;font-size:12px">解析成功：${r.total} 行数据 · 新增 ${r.added} · 更新 ${r.updated} · 跳过 ${r.skipped}<br>涉及盒型：${r.boxes.map(esc).join('、')}</div>`
      : `<div style="padding:10px;background:#fff1f0;color:#820014;border-radius:6px;font-size:12px">解析失败：${esc(r.msg)}</div>`;
  }).catch(e => {
    el.innerHTML = `<div style="padding:10px;background:#fff1f0;color:#820014;border-radius:6px;font-size:12px">无法读取文件：${esc(e.message)}</div>`;
  });
}

function openContactFormConfig() {
  const fields = DM.get('contactFormConfig');
  showModal('联系表单字段配置', `
    <div style="margin-bottom:12px"><button class="btn btn-sm btn-primary" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">+ 添加字段</button><div style="display:none" class="form-grid"><div class="form-group"><input class="form-input" id="f_new_field" placeholder="字段名"></div><div class="form-group"><select class="form-select" id="f_new_field_type"><option>文本输入</option><option>邮箱输入</option><option>多行文本</option><option>下拉选择</option></select></div></div></div>
    <div style="display:flex;flex-direction:column;gap:8px">${fields.map((f,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--gray-50);border-radius:6px"><span style="width:20px;text-align:center">${f.required?'🔴':'⚪'}</span><span style="flex:1;font-weight:500">${esc(f.name)}</span><span class="badge badge-gray">${esc(f.type)}</span><button class="btn btn-sm btn-danger" onclick="removeContactField(${i})">×</button></div>`).join('')}</div>
  `, () => {
    const newName = val('f_new_field');
    if (newName) {
      fields.push({name:newName,type:val('f_new_field_type')||'文本输入',required:false});
      DM.set('contactFormConfig', fields);
    }
    toast('配置已保存'); renderPage(currentPageId);
  });
}

function removeContactField(idx) {
  const fields = DM.get('contactFormConfig');
  fields.splice(idx, 1);
  DM.set('contactFormConfig', fields);
  toast('字段已移除'); closeModal(); renderPage(currentPageId);
}

function uploadCert(name) {
  showModal('上传证书 - ' + name, `
    <div class="form-group"><label class="form-label">选择证书文件</label><input class="form-input" type="file" id="f_cert_file" accept="image/*,.pdf"></div>
    <div style="margin-top:12px;padding:10px;background:var(--gray-50);border-radius:6px;font-size:12px;color:var(--gray-500)">上传成功后证书缩略图会出现在列表里，再点「替换」即覆盖为新文件。</div>
  `, async () => {
    const file = document.getElementById('f_cert_file')?.files?.[0];
    if (!file) { toast('请选择文件'); return false }
    closeModal();
    toast('正在上传 ' + file.name + ' …');
    try {
      const up = await cloudUpload(file, 'certs');
      const stored = docVal('settings_certs');
      stored[name] = { url: up.url, path: up.path, fileName: file.name, type: file.type.startsWith('image/') ? 'image' : 'pdf', uploaded: DM.now().split(' ')[0], by: whoami() };
      DM.set('settings_certs', stored);
      toast(name + ' 已上传到云端'); renderPage(currentPageId);
    } catch (e) { toast('上传失败：' + e.message) }
  });
}

// ========== 后端状态页 ==========
function renderSettingsCloud(c) {
  const cfg = window.JL_SB || {};
  c.innerHTML = `
    <div class="page-header"><div><h1 class="page-title">后端状态</h1><p class="page-desc">数据库连接、数据同步与账号</p></div></div>
    ${Sync.ready
      ? `<div class="banner" style="background:#e8f5ee;border:1px solid #b7dfc6;color:var(--primary)">已连接 Supabase，数据全员共享。上次拉取：${Sync.lastPull ? new Date(Sync.lastPull).toLocaleString('zh-CN') : '—'}</div>`
      : `<div class="banner banner-err">未连接后端数据库。当前录入的内容只保存在这台设备的浏览器里，同事看不到，换电脑也会丢。<br>状态：${Sync.msg || '未配置'}${Sync.errMsg ? ' · ' + Sync.errMsg : ''}</div>`}
    <div class="card mb-20"><div class="card-header"><span class="card-title">连接信息</span></div><div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
        <div><strong>Project URL</strong><br><span style="color:var(--gray-500);word-break:break-all">${esc(cfg.url || '未填写')}</span></div>
        <div><strong>anon key</strong><br><span style="color:var(--gray-500)">${cfg.key ? cfg.key.slice(0,10) + '…（已配置）' : '未填写'}</span></div>
      </div>
      <div style="margin-top:16px;font-size:12px;color:var(--gray-500);line-height:1.9">
        配置方法：编辑项目根目录下的 <code>js/sb-config.js</code>，把 Supabase 的 Project URL 与 anon public key 填进去，重新部署后刷新本页。<br>
        建表脚本在 <code>supabase/schema.sql</code>，粘贴到 Supabase 控制台 SQL Editor 执行一次即可，可重复执行。
      </div>
    </div></div>
    <div class="card mb-20"><div class="card-header"><span class="card-title">数据同步</span></div><div class="card-body">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="syncOnChipClick()">从服务器拉取最新</button>
        <button class="btn btn-secondary" onclick="Sync.retry()">重试未完成的上传</button>
        <button class="btn btn-secondary" onclick="importDemoData()">导入演示数据（测试用）</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--gray-500)">待上传 ${Sync.q.length} 条 · 失败 ${Sync.fails} 条 · 托管集合 ${CLOUD.row.length + CLOUD.doc.length} 个</div>
    </div></div>
    ${localStorage.getItem('jl_presync_backup') ? `
    <div class="card"><div class="card-header"><span class="card-title">本机旧数据</span></div><div class="card-body">
      <div style="font-size:13px;color:var(--gray-600);margin-bottom:12px">检测到后端开通前本机已录入的内容，尚未共享给同事。</div>
      <button class="btn btn-primary" onclick="doMigrateUp()">上传到服务器</button>
      <button class="btn btn-secondary" onclick="discardLocalBackup()">丢弃本机旧数据</button>
    </div></div>` : ''}`;
}

async function doMigrateUp() {
  toast('正在上传本机数据…');
  try {
    const n = await Sync.migrateLocalUp();
    if (Sync.q.length) { toast('部分上传失败，可稍后点右上角重试'); return }
    toast('已上传 ' + n + ' 项数据到服务器');
    renderPage(currentPageId);
  } catch (e) { toast('上传失败：' + e.message) }
}

function discardLocalBackup() {
  if (!confirm('确定丢弃本机旧数据？这些内容不会共享给同事，且无法恢复。')) return;
  localStorage.removeItem('jl_presync_backup');
  localStorage.setItem('jl_migrated_up', '1');
  toast('已忽略本机旧数据'); renderPage(currentPageId);
}

function importDemoData() {
  if (!confirm('导入演示数据？会用 L\'Oréal、Shopee 等假线索覆盖当前业务数据，仅供测试，事后可逐条删除。')) return;
  SEED_FORCE = true;
  seedData();
  SEED_FORCE = false;
  toast('演示数据已导入');
  renderPage(currentPageId);
}

// ========== INIT ==========
function paintUser() {
  const name = whoami();
  const n = document.getElementById('userName');
  const a = document.getElementById('userAvatar');
  if (n) n.textContent = name;
  if (a) a.textContent = (name[0] || '管').toUpperCase();
}

function startSessionGuard() {
  if (!Sync.ready) return;
  Sync.client.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') window.location.href = 'login.html';
    if (event === 'SIGNED_IN' && session) Sync.user = session.user;
  });
}

async function bootAdmin() {
  const ok = await Sync.init();
  Sync.muted = true;
  if (ok) {
    let user = null;
    try { user = await Sync.currentUser() } catch (e) {}
    if (!user) { window.location.href = 'login.html?reason=expired'; return }
    Sync.user = user;
    try {
      Sync.pendingLocal = Sync.snapshotLocal();
      await Sync.pullAll();
    } catch (e) { Sync.msg = '拉取失败'; Sync.errMsg = e.message }
  } else if (localStorage.getItem('jiulian_admin_token') !== 'authenticated') {
    window.location.href = 'login.html';
    return;
  }
  seedData();
  Sync.muted = false;
  if (ok) markSelfConfirmed();
  // 老数据里的 13 种盒型还是平的一层，开机时按产品线补成两级（种子自带 parent，这里只会动老数据）
  const catFixed = migrateCategoriesToTwoLevels();
  if (catFixed) toast(`商品分类已整理成两级：补了 ${catFixed} 处归属`);
  // 「设计」这一档已并入「主管」，老数据里的名字开机时统一换掉（改过就是空转）
  const roleFixed = migrateRoleDesignerToSupervisor();
  if (roleFixed) toast(`角色「设计」已改名为「主管」，动了 ${roleFixed} 处`);
  // 云端还没人建过的字典（盒型/材质/印刷/工艺…）刚被 seedData 补上默认值，
  // 现在静音已解除，把它们推上服务器，同事登录后拿到的就是同一份选项。
  if (ok && DICT_HEALED.length) {
    DICT_HEALED.forEach(k => Sync.track(k, [], DM.get(k)));
    DICT_HEALED.length = 0;
  }
  renderSidebar();
  navigateTo('dashboard-overview', '数据看板', '概览');
  toggleGroup('dashboard');
  Sync.badge();
  paintUser();
  startSessionGuard();
  if (ok && Sync.pendingLocal) {
    showBanner('warn', `本机存有 <strong>${esc(Sync.pendingLocal)}</strong> 项后端开通前录入的数据，尚未共享给同事。<button onclick="doMigrateUp()">上传到服务器</button>`);
  } else if (!ok) {
    showBanner('warn', `未连接后端数据库，你现在录入的内容只保存在这台设备上，同事看不到。<button onclick="navigateTo('settings-cloud','系统设置','后端状态')">查看配置方法</button>`);
  } else if (Sync.errMsg) {
    showBanner('err', `后端异常：${Sync.errMsg}<button onclick="location.reload()">重试</button>`);
  }
  if (Sync.fails) setTimeout(() => Sync.retry(), 3000);
}

bootAdmin();
</script>
