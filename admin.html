<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 玖联包装</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/sb-config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --primary:#1a5632;--primary-light:#2d7a4a;--primary-dark:#0d3b1f;
      --white:#fff;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
      --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;
      --gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;
      --red:#ef4444;--green:#10b981;--blue:#3b82f6;--yellow:#f59e0b;--purple:#8b5cf6;
      --shadow:0 1px 3px rgba(0,0,0,.1);--shadow-lg:0 4px 12px rgba(0,0,0,.12);
      --radius:8px;--radius-lg:12px;
    }
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-50);color:var(--gray-700);font-size:14px}
    .admin-layout{display:flex;min-height:100vh}

    /* Sidebar */
    .sidebar{width:260px;background:var(--white);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100}
    .sidebar-header{padding:20px;border-bottom:1px solid var(--gray-200)}
    .sidebar-logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo-icon img{width:100%;height:100%;object-fit:contain}
    .logo-text h1{font-size:15px;font-weight:600;color:var(--gray-900)}
    .logo-text p{font-size:11px;color:var(--gray-500)}
    .sidebar-nav{padding:8px 0;flex:1;overflow-y:auto}
    .nav-group{margin-bottom:2px}
    .nav-group-title{padding:10px 20px 6px;font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--gray-600);font-size:13px;font-weight:500;transition:all .15s;position:relative}
    .nav-item:hover{background:var(--gray-50);color:var(--primary)}
    .nav-item.active{background:rgba(26,86,50,.06);color:var(--primary);font-weight:600}
    .nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
    .nav-item .icon{font-size:15px;width:20px;text-align:center}
    .nav-item .badge{margin-left:auto;background:var(--red);color:var(--white);font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}
    .nav-parent{cursor:pointer}
    .nav-parent .arrow{margin-left:auto;font-size:10px;transition:transform .2s;color:var(--gray-400)}
    .nav-parent.expanded .arrow{transform:rotate(90deg)}
    .nav-children{display:none;background:var(--gray-50)}
    .nav-children.open{display:block}
    .nav-children .nav-item{padding-left:50px;font-size:12px}
    .nav-children .nav-item.active::before{display:none}
    .nav-children .nav-item.active{background:rgba(26,86,50,.08)}

    /* Main */
    .main{flex:1;margin-left:260px;display:flex;flex-direction:column;min-width:0}
    .topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
    .breadcrumb{font-size:13px;color:var(--gray-500)}
    .breadcrumb span{color:var(--gray-900);font-weight:500}
    .topbar-right{display:flex;align-items:center;gap:14px}
    .user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--gray-50);border-radius:20px}
    .user-chip .avatar{width:28px;height:28px;background:var(--primary);color:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
    .user-chip .name{font-size:12px;font-weight:500;color:var(--gray-700)}
    .sync-chip{padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--gray-200);background:var(--gray-50);color:var(--gray-500);white-space:nowrap}
    .sync-chip.on{background:#e8f5ee;border-color:#b7dfc6;color:var(--primary)}
    .sync-chip.warn{background:#fff5e6;border-color:#ffd591;color:#ad6800}
    .sync-chip.err{background:#fdecec;border-color:#f5b5b5;color:var(--red)}
    .banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
    .banner-warn{background:#fffbe6;border:1px solid #ffe58f;color:#614700}
    .banner-err{background:#fff1f0;border:1px solid #ffccc7;color:#820014}
    .banner button{margin-left:auto;padding:6px 14px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;font-size:12px;cursor:pointer;font-weight:600}
    .btn-logout{padding:6px 14px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:6px;font-size:12px;cursor:pointer;color:var(--gray-600);transition:all .15s}
    .btn-logout:hover{background:var(--gray-200)}

    /* Content */
    .content{padding:24px 28px;flex:1;min-width:0}
    .page-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
    .page-title{font-size:22px;font-weight:700;color:var(--gray-900)}
    .page-desc{font-size:13px;color:var(--gray-500);margin-top:4px}

    /* Buttons */
    .btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
    .btn-primary{background:var(--primary);color:var(--white)}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-secondary{background:var(--white);color:var(--gray-700);border:1px solid var(--gray-300)}
    .btn-secondary:hover{background:var(--gray-50)}
    .btn-danger{background:rgba(239,68,68,.1);color:var(--red)}
    .btn-danger:hover{background:rgba(239,68,68,.2)}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-icon{padding:6px 8px}

    /* Cards */
    .card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--gray-200);box-shadow:var(--shadow)}
    .card-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
    .card-title{font-size:15px;font-weight:600;color:var(--gray-900)}
    .card-body{padding:20px}

    /* Stats */
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
    .stat-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--gray-200);box-shadow:var(--shadow)}
    .stat-card .label{font-size:12px;color:var(--gray-500);font-weight:500;margin-bottom:8px}
    .stat-card .value{font-size:28px;font-weight:700;color:var(--gray-900)}
    .stat-card .change{font-size:11px;margin-top:4px}
    .stat-card .change.up{color:var(--green)}
    .stat-card .change.down{color:var(--red)}
    .stat-card .icon-box{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;float:right}
    .icon-blue{background:rgba(59,130,246,.1);color:var(--blue)}
    .icon-green{background:rgba(16,185,129,.1);color:var(--green)}
    .icon-yellow{background:rgba(245,158,11,.1);color:var(--yellow)}
    .icon-red{background:rgba(239,68,68,.1);color:var(--red)}
    .icon-purple{background:rgba(139,92,246,.1);color:var(--purple)}

    /* Table */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
    td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
    tr:hover td{background:var(--gray-50)}
    .td-id{font-weight:600;color:var(--primary)}
    .td-name{font-weight:500;color:var(--gray-900)}
    .td-sub{font-size:11px;color:var(--gray-500)}

    /* Badges */
    .badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500;display:inline-block}
    .badge-blue{background:rgba(59,130,246,.1);color:var(--blue)}
    .badge-green{background:rgba(16,185,129,.1);color:var(--green)}
    .badge-yellow{background:rgba(245,158,11,.1);color:var(--yellow)}
    .badge-red{background:rgba(239,68,68,.1);color:var(--red)}
    .badge-gray{background:var(--gray-100);color:var(--gray-500)}
    .badge-purple{background:rgba(139,92,246,.1);color:var(--purple)}

    /* Forms */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .form-group{margin-bottom:16px}
    .form-group.full{grid-column:1/-1}
    .form-label{display:block;font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:6px}
    .form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;font-family:inherit;color:var(--gray-700);transition:border-color .15s}
    .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,50,.08)}
    .form-textarea{resize:vertical;min-height:80px}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .2s}
    .modal-overlay.active{opacity:1;visibility:visible}
    .modal{background:var(--white);border-radius:var(--radius-lg);width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
    .modal-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
    .modal-header h3{font-size:16px;font-weight:600;color:var(--gray-900)}
    .modal-close{width:28px;height:28px;border:none;background:var(--gray-100);border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--gray-500)}
    .modal-close:hover{background:var(--gray-200)}
    .modal-body{padding:20px}
    .modal-footer{padding:16px 20px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}

    /* Toolbar */
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .toolbar .search{flex:1;min-width:200px;position:relative}
    .toolbar .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px}
    .toolbar .search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px}
    .toolbar select{padding:8px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;background:var(--white)}

    /* Pagination */
    .pagination{padding:12px 20px;border-top:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--gray-500)}
    .page-btns{display:flex;gap:4px}
    .page-btns button{padding:5px 10px;border:1px solid var(--gray-300);background:var(--white);border-radius:4px;font-size:12px;cursor:pointer}
    .page-btns button.active{background:var(--primary);color:var(--white);border-color:var(--primary)}

    /* Tabs */
    .tabs{display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:20px}
    .tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
    .tab:hover{color:var(--gray-700)}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

    /* Kanban */
    .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px}
    .kanban-col{min-width:220px;flex:1;background:var(--gray-50);border-radius:var(--radius);padding:12px}
    .kanban-col h4{font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .kanban-col h4 .count{background:var(--gray-200);padding:1px 6px;border-radius:8px;font-size:10px}
    .kanban-card{background:var(--white);border:1px solid var(--gray-200);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s}
    .kanban-card:hover{box-shadow:var(--shadow)}
    .kanban-card .title{font-size:12px;font-weight:600;color:var(--gray-800);margin-bottom:4px}
    .kanban-card .meta{font-size:11px;color:var(--gray-500)}

    /* Empty state */
    .empty{text-align:center;padding:48px 20px;color:var(--gray-400)}
    .empty .icon{font-size:40px;margin-bottom:12px}
    .empty p{font-size:14px}

    /* Toast */
    .toast{position:fixed;top:20px;right:20px;padding:12px 20px;background:var(--primary);color:var(--white);border-radius:8px;box-shadow:var(--shadow-lg);z-index:300;font-size:13px;font-weight:500;animation:slideIn .3s ease-out}
    @keyframes slideIn{from{transform:translateX(300px);opacity:0}to{transform:translateX(0);opacity:1}}

    /* Responsive */
    @media(max-width:1024px){
      .sidebar{transform:translateX(-100%);transition:transform .3s}
      .sidebar.open{transform:translateX(0)}
      .main{margin-left:0}
      .stats-row{grid-template-columns:1fr 1fr}
      .form-grid{grid-template-columns:1fr}
    }

    /* Utility */
    .flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.items-center{align-items:center}.justify-between{justify-content:space-between}
    .mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}
    .text-sm{font-size:12px}.text-gray{color:var(--gray-500)}.font-bold{font-weight:600}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon"><img src="images/logo.png" alt="玖联包装"></div>
        <div class="logo-text"><h1>玖联包装</h1><p>管理后台 v2.0</p></div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb">首页 / <span>数据看板</span></div>
      <div class="topbar-right">
        <div class="sync-chip" id="syncChip" onclick="syncOnChipClick()">本机数据</div>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">管</div>
          <div class="name" id="userName">管理员</div>
        </div>
        <button class="btn-logout" onclick="logout()">退出</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script>
// ========== MENU STRUCTURE ==========
const MENU = [
  { id:'dashboard', icon:'📊', label:'数据看板', children:[
    {id:'dashboard-overview',label:'概览'},{id:'dashboard-trend',label:'图表'},{id:'dashboard-todo',label:'提醒'}
  ]},
  { id:'leads', icon:'📥', label:'线索管理', children:[
    {id:'leads-pool',label:'线索池'},{id:'leads-detail',label:'线索详情'},{id:'leads-customers',label:'客户库'},{id:'leads-followup',label:'跟进记录'}
  ]},
  { id:'quotes', icon:'💰', label:'报价管理', children:[
    {id:'quotes-list',label:'报价单'},{id:'quotes-new',label:'新建报价'},{id:'quotes-pricebook',label:'价格簿'},{id:'quotes-template',label:'模板'}
  ]},
  { id:'orders', icon:'📦', label:'订单管理', children:[
    {id:'orders-list',label:'全部订单'},{id:'orders-production',label:'生产工单'},{id:'orders-payments',label:'付款'},{id:'orders-delivery',label:'发货'},{id:'orders-dieline',label:'刀模/Artwork'},{id:'orders-proof',label:'打样'}
  ]},
  { id:'products', icon:'🏷️', label:'商品管理', children:[
    {id:'products-categories',label:'分类'},{id:'products-list',label:'商品列表'},{id:'products-printing',label:'印刷色数库'},{id:'products-finish',label:'表面处理库'},{id:'products-material',label:'材质库'}
  ]},
  { id:'content', icon:'📝', label:'内容管理', children:[
    {id:'content-articles',label:'文章'},{id:'content-faq',label:'FAQ'},{id:'content-banner',label:'首页Banner'},{id:'content-cb',label:'跨境电商卡片'},{id:'content-advantages',label:'优势图标区'},{id:'content-stats',label:'数据展示'},{id:'content-testimonials',label:'评价'},{id:'content-clients',label:'合作品牌墙'},{id:'content-about',label:'About 关于我们'},{id:'content-process',label:'How We Work'},{id:'content-printing-guide',label:'印刷指南'}
  ]},
  { id:'forms', icon:'📋', label:'表单管理', children:[
    {id:'forms-list',label:'表单列表'},{id:'forms-quote-config',label:'报价表单配置'},{id:'forms-entries',label:'表单提交记录'}
  ]},
  { id:'media', icon:'🖼️', label:'媒体库', children:[
    {id:'media-files',label:'图片/文件'}
  ]},
  { id:'cases', icon:'🎓', label:'案例/示例', children:[
    {id:'cases-list',label:'案例列表'},{id:'cases-categories',label:'分类'}
  ]},
  { id:'policies', icon:'📜', label:'政策', children:[
    {id:'policies-list',label:'政策列表'}
  ]},
  { id:'settings', icon:'⚙️', label:'系统设置', children:[
    {id:'settings-site',label:'基本信息'},{id:'settings-seo',label:'SEO 设置'},{id:'settings-notifications',label:'通知模板'},{id:'settings-certs',label:'认证/资质'},{id:'settings-shipping',label:'配送区域'},{id:'settings-finance',label:'税率/货币'},{id:'settings-users',label:'管理员列表'},{id:'settings-roles',label:'角色管理'},{id:'settings-cloud',label:'后端状态'},{id:'settings-logs',label:'操作日志'}
  ]}
];

// ========== DATA MANAGER ==========
// DM.get 保持同步：云数据在启动时已整体拉到 localStorage 作为镜像，
// 所有渲染函数无需改写。写操作先落本地，再按行做差异上传。
const DM = {
  get(key, def=[]) { try { return JSON.parse(localStorage.getItem('jl_'+key)) || def } catch { return def } },
  has(key) { return localStorage.getItem('jl_'+key) !== null },
  set(key, val) {
    const prev = Sync.ready && !Sync.muted ? DM.get(key, null) : null;
    localStorage.setItem('jl_'+key, JSON.stringify(val));
    if (Sync.ready && !Sync.muted) Sync.track(key, prev, val);
  },
  raw(key, val) { localStorage.setItem('jl_'+key, JSON.stringify(val)) },
  genId(prefix) { return prefix + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,3).toUpperCase() },
  now() { return new Date().toISOString().slice(0,16).replace('T',' ') }
};

// DM.get 的缺省值是数组，往数组上挂具名属性会被 JSON.stringify 静默丢掉，
// 所以文档型（对象）集合一律走这里；已被写坏的 "[]" 也会在这里归一成 {}。
function docVal(key, def) {
  const v = DM.get(key, null);
  return (v && typeof v === 'object' && !Array.isArray(v)) ? v : (def || {});
}

// ========== CLOUD SYNC ==========
// row: 数组里每个对象带 id，一行一条，改动只上传受影响的那几条
// doc: 整体是一个对象/无 id 数组，整份覆盖到一行
const CLOUD = {
  row: ['leads','customers','quotes','orders','payments','dielines','categories','faqs','testimonials',
        'policies','users','logs','products','materials','articles','clients','mediaFiles','cases',
        'shippingZones','roles','proofs'],
  doc: ['printingOptions','finishingOptions','caseCategories','settings_site','settings_seo',
        'settings_notifications','settings_finance','settings_about','settings_process',
        'settings_printing_guide','settings_advantages','settings_stats','settings_banner',
        'settings_quote_template','settings_certs','pricebook','contactFormConfig']
};
// 首页这五块文案：旧版后台的保存函数压根不写马来文/中文栏，云端那条记录因此键比本机少，
// 整条覆盖会把本机刚填的内容抹掉。拉取时按字段合并（数组按下标合并），云端已有的字段仍以云端为准。
const MERGE_ON_PULL = ['settings_banner','settings_about','settings_stats','settings_advantages','settings_process'];
function mergeDoc(local, remote) {
  if (Array.isArray(remote)) {
    const l = Array.isArray(local) ? local : [];
    return remote.map((r, i) => mergeDoc(l[i], r));
  }
  if (remote && typeof remote === 'object') {
    if (!local || typeof local !== 'object' || Array.isArray(local)) return remote;
    return Object.assign({}, local, remote);
  }
  return remote;
}

// 否则同事会看到 L'Oréal、Shopee 这类假线索；需要时在系统设置里手动导入。
const DEMO_KEYS = new Set(['leads','customers','quotes','orders','payments','dielines','logs',
                           'products','mediaFiles','cases','clients','articles','proofs','testimonials','users']);

const Sync = {
  cfg: window.JL_SB || {},
  client: null,
  ready: false,
  muted: false,          // 启动灌种子期间不上传
  q: [],                 // 待上传操作
  fails: 0,              // 失败待重试条数
  timer: null,
  running: false,
  user: null,
  lastPull: 0,
  msg: '',

  async init() {
    if (!this.cfg.url || !this.cfg.key) { this.msg = '未配置后端'; return false }
    if (!window.supabase || !window.supabase.createClient) { this.msg = 'SDK 未加载'; return false }
    try {
      this.client = window.supabase.createClient(this.cfg.url, this.cfg.key, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
      const { data, error } = await this.client.from('jl_records').select('id').limit(1);
      if (error) { this.msg = '连不上数据库'; this.errMsg = error.message; return false }
      this.ready = true;
      return true;
    } catch (e) { this.msg = '后端异常'; this.errMsg = e.message; return false }
  },

  // 登录态：Supabase Auth 托管密码与会话，本地不留凭据
  async currentUser() {
    const { data } = await this.client.auth.getSession();
    return data && data.session ? data.session.user : null;
  },

  async signIn(email, password) {
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    return data.user;
  },

  async signOut() { try { await this.client.auth.signOut() } catch (e) {} },

  // 返回 loginable：注册接口是否顺手给了会话。
  // anon key 下 email_confirm 参数会被 GoTrue 忽略，所以只能事后判断，不能强制跳过邮箱验证。
  async signUp(email, password, name) {
    const { data, error } = await this.client.auth.signUp({ email, password, options: { data: { name } } });
    if (error) throw new Error(error.message);
    return { user: data.user, loginable: !!(data.session && data.session.access_token) };
  },

  // ---------- 写：差异上传 ----------
  track(key, prev, next) {
    if (!CLOUD.row.includes(key) && !CLOUD.doc.includes(key)) return;
    if (CLOUD.doc.includes(key)) {
      this.push({ t:'doc', col:key, rid:key, payload:next });
      return;
    }
    const a = Array.isArray(prev) ? prev : [];
    const b = Array.isArray(next) ? next : [];
    const before = new Map();
    a.forEach(x => { if (x && x.id != null) before.set(String(x.id), x) });
    b.forEach(x => {
      if (!x || x.id == null) return;
      const id = String(x.id), old = before.get(id);
      before.delete(id);
      if (!old || JSON.stringify(old) !== JSON.stringify(x)) this.push({ t:'row', col:key, rid:key+':'+id, payload:x });
    });
    before.forEach((_, id) => this.push({ t:'del', rid:key+':'+id }));
  },

  push(op) {
    this.q.push(op);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 350);
  },

  async flush() {
    if (this.running || !this.q.length) { this.badge(); return }
    this.running = true;
    const batch = this.q.splice(0, this.q.length);
    for (const op of batch) {
      const req = op.t === 'del'
        ? this.client.from('jl_records').delete().eq('id', op.rid)
        : this.client.from('jl_records').upsert({ id: op.rid, collection: op.col, payload: op.payload, updated_at: new Date().toISOString() }, { onConflict: 'id' });
      const { error } = await req;
      if (error) {
        this.q.push(op); this.fails++;
        this.msg = '上传失败'; this.errMsg = error.message;
      } else if (this.fails) this.fails--;
    }
    this.running = false;
    if (this.q.length) setTimeout(() => this.flush(), 4000);
    this.badge();
  },

  // ---------- 读：整体拉取 ----------
  async pullAll() {
    const rows = [];
    const PAGE = 1000;
    for (let from = 0; ; from += PAGE) {
      const { data, error } = await this.client.from('jl_records').select('id,collection,payload').range(from, from + PAGE - 1).order('id');
      if (error) throw new Error(error.message);
      rows.push(...(data || []));
      if (!data || data.length < PAGE) break;
    }
    const byCol = {};
    rows.forEach(r => (byCol[r.collection] = byCol[r.collection] || []).push(r));
    CLOUD.row.forEach(k => { DM.raw(k, (byCol[k] || []).map(r => r.payload)) });
    CLOUD.doc.forEach(k => {
      if (!byCol[k] || !byCol[k].length) return;
      const remote = byCol[k][0].payload;
      DM.raw(k, MERGE_ON_PULL.includes(k) ? mergeDoc(DM.get(k, null), remote) : remote);
    });
    this.lastPull = Date.now();
    return rows.length;
  },

  // 一次性把本机旧数据推上服务器（同事此前各自录入的内容）
  async migrateLocalUp() {
    const backup = JSON.parse(localStorage.getItem('jl_presync_backup') || '{}');
    let n = 0;
    Object.keys(backup).forEach(k => { n += Array.isArray(backup[k]) ? backup[k].length : 1 });
    this.muted = true;
    Object.keys(backup).forEach(k => DM.raw(k, backup[k]));
    this.muted = false;
    CLOUD.row.forEach(k => { if (backup[k]) this.track(k, [], backup[k]) });
    CLOUD.doc.forEach(k => { if (backup[k] !== undefined) this.push({ t:'doc', col:k, rid:k, payload:backup[k] }) });
    await this.flush();
    if (this.q.length) { toast('有 ' + this.q.length + ' 条上传失败，稍后点右上角重试'); return n }
    localStorage.removeItem('jl_presync_backup');
    localStorage.setItem('jl_migrated_up', '1');
    return n;
  },

  // 记下本机已有内容，供"上传到服务器"用；演示数据本身不算同事的劳动成果，排除掉
  snapshotLocal() {
    if (localStorage.getItem('jl_migrated_up') || localStorage.getItem('jl_presync_backup')) return 0;
    const snap = {}; let n = 0;
    CLOUD.row.forEach(k => {
      const v = DM.get(k, null);
      if (!Array.isArray(v) || !v.length) return;
      const keep = DEMO_KEYS.has(k) ? v.filter(x => !(x && DEMO_SEED_IDS.has(String(x.id)))) : v;
      if (keep.length) { snap[k] = keep; n += keep.length }
    });
    CLOUD.doc.forEach(k => {
      const v = DM.get(k, null);
      if (v !== null && v !== undefined) { snap[k] = v; n += 1 }
    });
    if (n) localStorage.setItem('jl_presync_backup', JSON.stringify(snap));
    return n;
  },

  badge() {
    const el = document.getElementById('syncChip');
    if (!el) return;
    el.className = 'sync-chip ' + (!this.ready ? '' : this.fails ? 'err' : this.q.length ? 'warn' : 'on');
    if (!this.ready) el.textContent = this.msg === '未配置后端' ? '本机数据' : (this.msg || '未连接');
    else if (this.fails) el.textContent = '上传失败 ' + this.q.length + ' 条';
    else if (this.q.length) el.textContent = '同步中 ' + this.q.length + ' 条';
    else el.textContent = '已同步 · ' + new Date(this.lastPull || Date.now()).toTimeString().slice(0,5);
  },

  async retry() {
    this.fails = 0; this.msg = '';
    await this.flush();
    if (!this.q.length) toast('全部数据已同步到服务器');
  },

  // 关页/退出前把队列清空，避免最后几条改动没上传
  async drain(timeoutMs = 8000) {
    if (!this.ready) return;
    const t0 = Date.now();
    while (this.q.length && Date.now() - t0 < timeoutMs) {
      await this.flush();
      if (this.q.length) await new Promise(r => setTimeout(r, 300));
    }
  }
};

// ========== 云存储 ==========
// 文件真正传到 Supabase Storage 的 jl-uploads 桶，返回公网地址，全员可见
async function cloudUpload(file, dir) {
  if (!Sync.ready) throw new Error('未连接后端，无法上传文件');
  if (!file) throw new Error('请先选择文件');
  if (file.size > 20 * 1024 * 1024) throw new Error('文件超过 20MB');
  const safe = String(file.name || 'file').replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = dir + '/' + new Date().toISOString().slice(0,10) + '-' + Date.now().toString(36) + '-' + safe;
  const { data, error } = await Sync.client.storage.from('jl-uploads')
    .upload(path, file, { upsert: false, contentType: file.type || 'application/octet-stream' });
  if (error) throw new Error(error.message);
  return { path: data.path, url: Sync.client.storage.from('jl-uploads').getPublicUrl(data.path).data.publicUrl };
}

function whoami() {
  return (Sync.user && (Sync.user.user_metadata?.name || Sync.user.email?.split('@')[0])) || '管理员';

// 负责人候选 = 后台真实账号名单；没建账号时至少能选到自己
function staffNames() {
  const names = DM.get('users').filter(u => u.active !== false).map(u => (u.name || '').trim()).filter(Boolean);
  const me = whoami();
  if (!names.includes(me)) names.unshift(me);
  return [...new Set(names)];
}

// 生成下拉框选项，并把当前值标成 selected。
// 当前值不在候选里（同事改名、历史数据）时追加一条，否则保存会把它覆盖成第一项。
function selOpts(list, current, ph) {
  const arr = [...new Set(list.map(x => typeof x === 'string' ? x : ((x && (x.name || x.region)) || '')).filter(Boolean))];
  const cur = current == null ? '' : String(current);
  if (cur && !arr.includes(cur)) arr.unshift(cur);
  const head = ph ? `<option value="">-- ${esc(ph)} --</option>` : '';
  return head + arr.map(v => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');
}

// 官网询价表单存的是盒型 slug（food-box），价格簿按盒型名索引 → 展示和查价前先换算成分类名
function boxName(v) {
  if (!v) return '';
  const c = DM.get('categories').find(x => x.name === v || x.slug === v);
  return c ? c.name : String(v);
}

function fmtSize(n) {
  if (!n && n !== 0) return '—';
  return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB';
}

// ========== SEED DATA ==========
// 只补本机还没有的集合。接上后端后，DEMO_KEYS 里的业务数据一律初始化为空，
// 避免把 L'Oréal / Shopee 这类演示线索灌进全公司共享的数据库。
let SEED_FORCE = false;
function seedOne(key, demo) {
  if (SEED_FORCE && DEMO_KEYS.has(key)) { DM.set(key, demo); return }
  if (DM.has(key)) return;
  DM.set(key, Sync.ready && DEMO_KEYS.has(key) ? [] : demo);
}

// 基础选项，不是演示噪音。接上后端后 pullAll 会把云端没有行的集合直接写成本机空数组，
// 于是这些页面下拉框一个选项都没有（新建报价的「盒型」「材质」就是被这样清空的）。
// 所以这里改成"空即补"，补出来的默认值等启动解除静音后推上云端，让同事共享同一份。
const DICT_HEALED = [];
function seedDict(key, demo) {
  const cur = DM.get(key, null);
  if (Array.isArray(cur) && cur.length) return;
  if (!Sync.ready && DM.has(key)) return;   // 本机模式下删空是用户自己的选择，不灌回去
  DM.set(key, demo);
  if (Sync.ready) DICT_HEALED.push(key);
}

function toggleGroup(id) {
  const parent = document.querySelector(`[data-group="${id}"]`);
  const children = document.getElementById('children-' + id);
  const isOpen = children.classList.contains('open');
  document.querySelectorAll('.nav-children').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.nav-parent').forEach(p => p.classList.remove('expanded'));
  if (!isOpen) {
    children.classList.add('open');
    parent.classList.add('expanded');
  }
}

// ========== DASHBOARD ==========
function localDate(d) {
  const x = d || new Date();
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}

function dayCounts(items, days, getDate) {
  const out = [];
  const base = new Date(); base.setHours(0, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(base.getTime() - i * 864e5);
    const key = localDate(d);
    out.push({ key, label: key.slice(5), n: items.filter(x => String(getDate(x) || '').slice(0, 10) === key).length });
  }
  return out;
}

function groupCount(items, keyFn) {
  const m = new Map();
  items.forEach(x => { const k = keyFn(x) || '未填'; m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n);
}

function distBars(rows, color) {
  const total = rows.reduce((s, r) => s + r.n, 0);
  if (!total) return '<div class="empty"><p>暂无数据</p></div>';
  return rows.map(r => `<div class="flex items-center justify-between"><span style="width:120px">${esc(r.label)}</span><div style="flex:1;margin:0 12px;height:8px;background:var(--gray-200);border-radius:4px"><div style="width:${Math.max(3, Math.round(r.n / total * 100))}%;height:100%;background:${color};border-radius:4px"></div></div><span class="font-bold">${r.n} 条 · ${Math.round(r.n / total * 100)}%</span></div>`).join('');
}

    <div class="pagination"><span id="leadsCount"></span><div class="page-btns" id="leadsPages"></div></div></div>`;

function filteredLeads() {
  let rows = DM.get('leads');
  if (leadSearch) rows = rows.filter(l => (l.name+' '+l.company+' '+l.phone+' '+l.email).toLowerCase().includes(leadSearch));
  if (leadStatusFilter) rows = rows.filter(l => l.status === leadStatusFilter);
  return rows;
}

function applyLeadFilter() {
  const body = document.getElementById('leadsTableBody');
  if (!body) return;
  const rows = filteredLeads();
  const totalPages = Math.max(1, Math.ceil(rows.length / LEAD_PAGE_SIZE));
  if (leadPage > totalPages) leadPage = totalPages;
  const start = (leadPage - 1) * LEAD_PAGE_SIZE;
  const pageRows = rows.slice(start, start + LEAD_PAGE_SIZE);
  body.innerHTML = pageRows.length ? pageRows.map(l=>leadRow(l)).join('') : `<tr><td colspan="11" style="text-align:center;padding:40px;color:#999">无匹配结果</td></tr>`;
  const filtering = leadSearch || leadStatusFilter;
  document.getElementById('leadsCount').textContent = `共 ${rows.length} 条${filtering ? `（已筛选，总计 ${DM.get('leads').length} 条）` : ''}`;
  document.getElementById('leadsPages').innerHTML = totalPages > 1
    ? Array.from({length:totalPages},(_,i)=>`<button class="${i+1===leadPage?'active':''}" onclick="gotoLeadPage(${i+1})">${i+1}</button>`).join('')
    : '';
}

function gotoLeadPage(n) { leadPage = n; applyLeadFilter(); }

function leadRow(l) {
  return `<tr><td class="td-id">${esc(l.id)}</td><td><span class="badge badge-gray">${esc(l.source)}</span></td><td class="td-name">${esc(l.name)}</td><td>${esc(l.company)}</td><td>${esc(l.phone)}</td><td>${esc(boxName(l.boxType))}</td><td>${esc(l.quantity)}</td><td style="white-space:nowrap">${statusBadge(l.status)}</td><td style="white-space:nowrap">${esc(l.assignee) || '<span style="color:var(--gray-400)">未分配</span>'}</td><td style="white-space:nowrap">${esc(l.created)}</td><td style="white-space:nowrap"><button class="btn btn-sm btn-secondary" onclick="viewLead('${l.id}')">查看</button> <button class="btn btn-sm btn-secondary" onclick="editLead('${l.id}')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteLead('${l.id}')">删除</button></td></tr>`;

  const labels = {new:'新线索',quoted:'已报价',negotiating:'洽谈中',sample:'打样中',won:'已成交',lost:'已流失',draft:'草稿',sent:'已发出',accepted:'已接受',approved:'已确认',rejected:'已拒绝',expired:'已过期'};
  return `<span class="badge ${m[s]||'badge-gray'}">${esc(labels[s]||s)}</span>`;
}

function statusLabel(s) {
  return {new:'新线索',quoted:'已报价',negotiating:'洽谈中',sample:'打样中',won:'已成交',lost:'已流失',draft:'草稿',sent:'已发出',accepted:'已接受',approved:'已确认',rejected:'已拒绝',expired:'已过期'}[s] || s;
}

let quotePrefillLead = null;

function convertLeadToQuote(l) {
  const bt = boxName(l.boxType);
  const unitPrice = lookupTierPrice(bt, l.quantity);
  if (!(unitPrice > 0)) {
    quotePrefillLead = l.id;
    toast('价格簿里没有「' + (bt || '该盒型') + '」' + (l.quantity || '') + 'pcs 这一档，请到新建报价里手填单价');
    navigateTo('quotes-new','报价管理','新建报价');
    return;
  }
  const t = quoteTotals(l.quantity, unitPrice);
  const quotes = DM.get('quotes');
  const q = {id:DM.genId('QT'), leadId:l.id, customer:l.company||l.name, contact:[l.name,l.email||l.phone].filter(Boolean).join(' / '),
             product:bt, size:l.size, printing:l.printing, finish:l.finishing,
             note:l.notes||'', quantity:l.quantity, unitPrice, subtotal:t.subtotal, sst:t.sst, total:t.total,
             status:'draft', date:new Date().toISOString().slice(0,10),
             validUntil:new Date(Date.now()+quoteFinance().validDays*864e5).toISOString().slice(0,10),
             creator:whoami(), created:DM.now()};
  quotes.push(q);
  DM.set('quotes', quotes);
  const leads = DM.get('leads');
  const lead = leads.find(x => x.id === l.id);
  if (lead) { lead.status = 'quoted'; DM.set('leads', leads); }
  toast('已生成报价单 ' + q.id + '（RM ' + q.total.toFixed(2) + '）');
  navigateTo('quotes-list','报价管理','报价单');
}

function lookupTierPrice(boxType, qty) {
  const rows = docVal('pricebook')[boxName(boxType)] || [];
  const n = parseInt(qty) || 0;
  let best = -1, bestTier = -1;
  rows.forEach(r => {
    (r.p || []).forEach((price, ti) => {
      const tier = parseInt(PB_TIERS[ti]) || 0;
      if (price > 0 && tier <= n && tier > bestTier) { bestTier = tier; best = ti; }
    });
  });
  if (best < 0) return 0;
  const row = rows.find(r => r.p && r.p[best] > 0);
  return row ? Number(row.p[best]) : 0;
}

function quoteFinance() {
  const f = docVal('settings_finance');
  return { sstRate: Number(f.sstRate) > 0 ? Number(f.sstRate) : 10, validDays: parseInt(f.validDays) > 0 ? parseInt(f.validDays) : 14 };
}

function quoteTotals(quantity, unitPrice) {
  const { sstRate } = quoteFinance();
  const subtotal = +(quantity * unitPrice).toFixed(2);
  const sst = +(subtotal * sstRate / 100).toFixed(2);
  return { subtotal, sst, total: +(subtotal + sst).toFixed(2), sstRate };
}

function autoQuotePrice() {
  const boxType = val('q_boxType');
  const qty = parseInt((document.getElementById('q_quantity') || {}).value) || 0;
  const price = boxType ? lookupTierPrice(boxType, qty) : 0;
  const el = document.getElementById('q_unitPrice');
  const hint = document.getElementById('q_priceHint');
  if (!el) return;
  if (price > 0) {
    el.value = price.toFixed(2);
    el.dataset.fromPb = '1';
    if (hint) hint.textContent = `单价取自价格簿（${boxType}）`;
  } else {
    // 价格簿取不到时，自动填过的单价要清掉，否则会留着上一档的错误单价被当成手填价保存
    if (el.dataset.fromPb === '1') { el.value = ''; el.dataset.fromPb = ''; }
    if (hint) hint.textContent = qty && boxType ? '价格簿里没有这个盒型/数量档，请手填单价' : '';
  }
  recalcQuote();
}

function recalcQuote() {
  const quantity = parseInt((document.getElementById('q_quantity') || {}).value) || 0;
  const unitPrice = parseFloat((document.getElementById('q_unitPrice') || {}).value) || 0;
  const t = quoteTotals(quantity, unitPrice);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('q_sub', 'RM ' + t.subtotal.toFixed(2));
  set('q_sst', 'RM ' + t.sst.toFixed(2));
  set('q_total', 'RM ' + t.total.toFixed(2));
}

function fillQuoteFromLead() {
  const pick = (document.getElementById('q_lead') || {}).value || '';
  const l = DM.get('leads').find(x => x.id === pick.split(' - ')[0]);
  if (!l) return;
  const put = (id, v) => { const el = document.getElementById(id); if (el && !el.value) el.value = v || ''; };
  put('q_customer', l.company || l.name);
  put('q_contact', [l.name, l.email || l.phone].filter(Boolean).join(' / '));
  put('q_size', l.size);
  const box = document.getElementById('q_boxType');
  const bn = boxName(l.boxType);
  if (box && bn && [...box.options].some(o => o.value === bn)) box.value = bn;
  const qel = document.getElementById('q_quantity');
  if (qel && !qel.value) qel.value = parseInt(l.quantity) || '';
  autoQuotePrice();
}

function generateQuote(status) {
  const customer = val('q_customer');
  const product = val('q_boxType');
  const quantity = parseInt(val('q_quantity')) || 0;
  const unitPrice = parseFloat(val('q_unitPrice')) || 0;
  if (!customer) { toast('请填写客户公司'); return; }
  if (!product) { toast('请选择盒型'); return; }
  if (quantity <= 0) { toast('请填写数量'); return; }
  if (unitPrice <= 0) { toast('请填写单价（或在价格簿里维护该盒型价格）'); return; }
  const t = quoteTotals(quantity, unitPrice);
  const q = {
    id: DM.genId('QT'),
    leadId: (val('q_lead') || '').split(' - ')[0],
    customer, contact: val('q_contact'), product,
    size: val('q_size'), material: val('q_material'), printing: val('q_printing'), finish: val('q_finish'),
    note: (document.getElementById('q_note') || {}).value?.trim() || '',
    quantity, unitPrice, subtotal: t.subtotal, sst: t.sst, total: t.total,
    status: status || 'draft',
    validUntil: val('q_validUntil') || new Date(Date.now() + quoteFinance().validDays * 864e5).toISOString().slice(0, 10),
    date: val('q_date') || new Date().toISOString().slice(0, 10),
    creator: whoami(), created: DM.now()
  };
  const quotes = DM.get('quotes');
  quotes.push(q);
  DM.set('quotes', quotes);
  if (q.leadId) {
    const leads = DM.get('leads');
    const lead = leads.find(x => x.id === q.leadId);
    if (lead) { lead.status = 'quoted'; DM.set('leads', leads); }
  }
  toast(status === 'sent' ? `报价单 ${q.id} 已生成（RM ${q.total.toFixed(2)}）` : `草稿 ${q.id} 已保存`);
  navigateTo('quotes-list', '报价管理', '报价单');
  if (status === 'sent') setTimeout(() => printQuote(q.id), 400);
}

let quotePrintFrame = null;

function printQuote(id) {
  const q = DM.get('quotes').find(x => x.id === id);
  if (!q) { toast('找不到这张报价单'); return; }
  openQuotePrint(quotePrintHtml(q));
}

function openQuotePrint(html) {
  closeQuotePrint();
  quotePrintFrame = document.createElement('iframe');
  quotePrintFrame.setAttribute('aria-hidden', 'true');
  quotePrintFrame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(quotePrintFrame);
  const doc = quotePrintFrame.contentDocument;
  doc.open();
  doc.write(html);
  doc.close();
  const win = quotePrintFrame.contentWindow;
  win.addEventListener('afterprint', closeQuotePrint);
  setTimeout(() => { try { win.focus(); win.print(); } catch (e) { toast('打印窗口被浏览器拦截，请重试'); } }, 350);
  // 打印对话框关掉后 iframe 会触发 afterprint；兜底防止残留
  setTimeout(closeQuotePrint, 120000);
}

function closeQuotePrint() {
  if (quotePrintFrame) { quotePrintFrame.remove(); quotePrintFrame = null; }
}

  c.querySelectorAll('.pb-sku').forEach(el => el.addEventListener('change', () => savePricebook(c)));

function savePricebook(c) {
  const pb = docVal('pricebook');
  const rows = (pb[pricebookTab] = pb[pricebookTab] || []);
  c.querySelectorAll('.pb-sku').forEach(el => { if(rows[el.dataset.i]) rows[el.dataset.i].sku = el.value.trim(); });
  c.querySelectorAll('.pb-size').forEach(el => { if(rows[el.dataset.i]) rows[el.dataset.i].size = el.value.trim(); });
  c.querySelectorAll('.pb-price').forEach(el => { if(rows[el.dataset.i]) rows[el.dataset.i].p[el.dataset.p] = el.value === '' ? '' : parseFloat(el.value); });
  DM.set('pricebook', pb);
  toast('价格已保存');
}

function switchPriceTab(i) {
  const tabs = Object.keys(docVal('pricebook'));
  if (tabs[i] === undefined) return;
  pricebookTab = tabs[i];
  renderPage(currentPageId);
}

function addPricebookRow() {
  const pb = docVal('pricebook');
  if (!pricebookTab) { toast('请先选择盒型'); return; }
  showModal('新增 SKU - ' + pricebookTab, `
    <div class="form-grid">

    pb[pricebookTab] = pb[pricebookTab] || [];

function deletePricebookRow(i) {

  toast('SKU 已删除'); renderPage(currentPageId);
}

async function saveQuoteLogo(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const up = await cloudUpload(file, 'branding');
    const tpl = docVal('settings_quote_template');
    tpl.logo = up.url;
    tpl.logoPath = up.path;
    DM.set('settings_quote_template', tpl);
    const box = document.getElementById('fs_logo_box');
    if (box) box.innerHTML = `<img src="${safeHref(up.url)}" alt="Logo" style="max-height:60px;max-width:240px;border:1px solid var(--gray-200);border-radius:6px;padding:4px;background:#fff"> <button class="btn btn-sm btn-secondary" onclick="removeQuoteLogo()">移除</button>`;
    toast('Logo 已上传');
  } catch (e) {
    toast('Logo 上传失败：' + e.message);
    input.value = '';
  }
}

function removeQuoteLogo() {
  const tpl = docVal('settings_quote_template');
  delete tpl.logo;
  delete tpl.logoPath;
  DM.set('settings_quote_template', tpl);

const PROD_STEPS = ['pending_deposit','deposit_paid','artwork','proofing','confirming','producing','shipping','shipped','done'];
const PROD_LABEL = {pending_deposit:'待付定金',deposit_paid:'已付定金',artwork:'刀模/Artwork',proofing:'打样中',confirming:'待客户确认',producing:'生产中',shipping:'待发货',shipped:'已发货',done:'完成'};
const PROD_BY_LABEL = Object.keys(PROD_LABEL).reduce((m, k) => { m[PROD_LABEL[k]] = k; return m }, {});
const COURIERS = ['自送','J&T Express','Pos Laju','Ninja Van','DHL eCommerce','GDEX','Lalamove','货代 / 海运'];
const PAY_METHODS = ['银行转账','现金','TT 电汇','支票','线上支付'];
const DELIVERY_ZONES = ['Kuala Lumpur','Selangor','Pulau Pinang','Johor','Melaka','Perak','Sabah','Sarawak'];

function depositPercent() { const p = parseInt(docVal('settings_finance').depositPercent); return p > 0 && p <= 100 ? p : 50 }
function inDays(n) { return new Date(Date.now() + n * 864e5).toISOString().slice(0, 10) }
function today() { return new Date().toISOString().slice(0, 10) }
function orderPay(od, type) { return DM.get('payments').find(p => p.orderId === od.id && p.type === type) }
function orderReceived(od) {
  return +DM.get('payments').filter(p => p.orderId === od.id && p.status === 'confirmed').reduce((s, p) => s + (Number(p.amount) || 0), 0).toFixed(2);
}

function renderOrdersList(c) {
  const orders = DM.get('orders');
  const total = orders.reduce((s, o) => s + (Number(o.amount) || 0), 0);
  c.innerHTML = `
    <div class="page-header"><div><h1 class="page-title">全部订单</h1><p class="page-desc">${orders.length ? `共 ${orders.length} 张，金额合计 RM ${money2(total)}。报价客户确认后到「报价管理 → 报价单」点「转订单」` : '还没有订单。到「报价管理 → 报价单」把已发出的报价点「转订单」，或直接点右上角新建'}</p></div><button class="btn btn-primary" onclick="openOrderModal()">+ 新建订单</button></div>

function editOrder(id) {
  const o = DM.get('orders').find(x => x.id === id);
  if (!o) { toast('找不到这张订单'); return; }
  openOrderModal(o);

function openOrderModal(o, prefill) {
  const isEdit = !!o;
  const d = o || prefill || {};
  const amount = Number(d.amount) || 0;
  const pct = Number(d.depositPct) > 0 ? Number(d.depositPct) : depositPercent();
  showModal(isEdit ? '编辑订单 ' + o.id : '新建订单', `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">客户 *</label><input class="form-input" id="o_customer" value="${esc(d.customer||'')}"></div>
      <div class="form-group"><label class="form-label">产品 / 内容</label><input class="form-input" id="o_product" value="${esc(d.product||'')}"></div>
      <div class="form-group"><label class="form-label">金额 (RM) *</label><input class="form-input" type="number" min="0" step="0.01" id="o_amount" value="${amount ? money2(amount) : ''}" oninput="orderModalDeposit()"></div>
      <div class="form-group"><label class="form-label">定金比例 (%)</label><input class="form-input" type="number" min="0" max="100" id="o_pct" value="${esc(pct)}" oninput="orderModalDeposit()"></div>
      <div class="form-group"><label class="form-label">定金金额 (RM)</label><input class="form-input" type="number" min="0" step="0.01" id="o_deposit" value="${money2(amount * pct / 100)}"></div>
      <div class="form-group"><label class="form-label">预计交货日期</label><input class="form-input" type="date" id="o_date" value="${esc(d.deliveryDate || inDays(14))}"></div>
      <div class="form-group"><label class="form-label">负责人</label><select class="form-select" id="o_assignee">${selOpts(staffNames(), d.assignee || whoami(), '未分配')}</select></div>
      <div class="form-group"><label class="form-label">生产状态</label><select class="form-select" id="o_status">${selOpts(PROD_STEPS.map(s => PROD_LABEL[s]), PROD_LABEL[d.productionStatus] || PROD_LABEL.pending_deposit)}</select></div>
      <div class="form-group"><label class="form-label">配送区域</label><select class="form-select" id="o_zone">${selOpts(DELIVERY_ZONES.concat(DM.get('shippingZones').map(z => z.region)), d.zone, '未定')}</select></div>
      <div class="form-group full"><label class="form-label">备注</label><textarea class="form-textarea" id="o_note" rows="2">${esc(d.note||'')}</textarea></div>
    </div>
    ${isEdit ? '' : '<div style="margin-top:12px;font-size:12px;color:var(--gray-500)">保存后自动生成「定金 / 尾款」两笔待收款，同事在「订单管理 → 付款」里登记到账。</div>'}
  `, () => {
    const customer = val('o_customer');
    if (!customer) { toast('请填写客户'); return false }
    const amt = parseFloat(val('o_amount')) || 0;
    if (amt <= 0) { toast('请填写订单金额'); return false }
    const p = Math.min(100, Math.max(0, parseFloat(val('o_pct')) || 0));
    const dep = parseFloat(val('o_deposit')) > 0 ? +parseFloat(val('o_deposit')).toFixed(2) : +(amt * p / 100).toFixed(2);
    const st = PROD_BY_LABEL[val('o_status')] || 'pending_deposit';
    const orders = DM.get('orders');
    const fields = {
      customer, product: val('o_product'), amount: +amt.toFixed(2), depositPct: p, depositAmount: dep,
      deliveryDate: val('o_date'), assignee: val('o_assignee'), productionStatus: st,
      zone: val('o_zone'), note: (document.getElementById('o_note') || {}).value?.trim() || ''
    };
    let od;
    if (isEdit) {
      Object.assign(o, fields);
      od = o;
      DM.set('orders', orders);
      toast('订单 ' + o.id + ' 已更新');
      writeLog('编辑订单', o.id + ' ' + o.customer);
    } else {
      od = Object.assign({
        id: DM.genId('OD'), quoteId: d.quoteId || '', depositPaid: false, productionStatus: st,
        creator: whoami(), created: DM.now()
      }, fields);
      orders.push(od);
      DM.set('orders', orders);
      addPendingPayments(od);
      if (d.quoteId) linkQuoteToOrder(d.quoteId, od);
      toast('订单 ' + od.id + ' 已创建');
      writeLog('新建订单', od.id + ' ' + od.customer + ' RM ' + money2(od.amount));
    }
    const all = DM.get('orders');
    const cur = all.find(x => x.id === od.id);
    if (cur) { syncOrderMoney(cur); DM.set('orders', all); }
    navigateTo('orders-list', '订单管理', '全部订单');
  });
}

function orderModalDeposit() {
  const amt = parseFloat((document.getElementById('o_amount') || {}).value) || 0;
  const p = Math.min(100, Math.max(0, parseFloat((document.getElementById('o_pct') || {}).value) || 0));
  const el = document.getElementById('o_deposit');
  if (el) el.value = money2(amt * p / 100);
}

function linkQuoteToOrder(quoteId, od) {
  const quotes = DM.get('quotes');
  const q = quotes.find(x => x.id === quoteId);
  if (!q) return;
  q.status = 'approved';
  q.orderId = od.id;
  DM.set('quotes', quotes);
  const leads = DM.get('leads');
  const l = leads.find(x => x.id === q.leadId);
  if (l) { l.status = 'won'; DM.set('leads', leads); }
}

function addPendingPayments(od) {
  const payments = DM.get('payments');
  const site = docVal('settings_site');
  const mk = (type, typeLabel, amount) => ({
    id: DM.genId('PAY'), orderId: od.id, orderNo: od.id, customer: od.customer,
    type, typeLabel, amount: +amount.toFixed(2), method: '银行转账',
    bankName: '', accountNo: '', accountName: site.enName || '', date: '', receiptNo: '',
    status: 'pending', note: '待客户付款', creator: whoami(), created: DM.now()
  });
  const dep = Number(od.depositAmount) || 0;
  const fin = +((Number(od.amount) || 0) - dep).toFixed(2);
  if (dep > 0) payments.push(mk('deposit', '定金 ' + (od.depositPct || depositPercent()) + '%', dep));
  if (fin > 0) payments.push(mk('final', '尾款 ' + (100 - (od.depositPct || depositPercent())) + '%', fin));
  DM.set('payments', payments);
}

function syncOrderMoney(od) {
  const received = orderReceived(od);
  const pays = DM.get('payments');
  const dep = pays.find(p => p.orderId === od.id && p.type === 'deposit');
  const fin = pays.find(p => p.orderId === od.id && p.type === 'final');
  const next = {
    received,
    depositPaid: !!(dep && dep.status === 'confirmed'),
    finalPaid: !!(fin && fin.status === 'confirmed')
  };
  next.productionStatus = od.productionStatus || 'pending_deposit';
  if (next.depositPaid && next.productionStatus === 'pending_deposit') next.productionStatus = 'deposit_paid';
  if (next.finalPaid && next.productionStatus === 'shipped') next.productionStatus = 'done';
  Object.assign(od, next);
  const orders = DM.get('orders');
  const cur = orders.find(x => x.id === od.id);
  if (cur) { Object.assign(cur, next); DM.set('orders', orders); }
}

let kanbanDrag = null;
function kanbanStart(e, id) {
  kanbanDrag = id;
  try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}
  e.currentTarget.style.opacity = '.45';
}
function kanbanEnd(e) { e.currentTarget.style.opacity = ''; kanbanDrag = null; }
function kanbanOver(e) { e.preventDefault(); e.currentTarget.style.outline = '2px dashed var(--primary)'; }
function kanbanLeave(e) { e.currentTarget.style.outline = ''; }
function kanbanDrop(e, status) {
  e.preventDefault();
  e.currentTarget.style.outline = '';
  const id = kanbanDrag || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  if (!id) return;
  const orders = DM.get('orders');
  const o = orders.find(x => x.id === id);
  if (!o || o.productionStatus === status) return;
  const from = o.productionStatus;
  o.productionStatus = status;
  syncOrderMoney(o);
  DM.set('orders', orders);
  writeLog('生产状态变更', `${o.id} ${PROD_LABEL[from] || from} → ${PROD_LABEL[status]}`);
  toast(`${o.id} 已移到「${PROD_LABEL[status]}」`);
  renderPage(currentPageId);
}

function openPaymentModal(orderId, type, payId) {
  const payments = DM.get('payments');
  const p = payId ? payments.find(x => x.id === payId) : null;
  const orders = DM.get('orders');
  if (!orderId && !p) {
    if (!orders.length) { toast('先创建订单，再登记收款'); return; }
    orderId = orders[0].id;
  }
  const od = p ? (orders.find(x => x.id === p.orderId) || {}) : (orders.find(x => x.id === orderId) || {});
  const suggest = p ? p.amount : (type === 'final' ? +((Number(od.amount) || 0) - (Number(od.depositAmount) || 0)).toFixed(2) : (Number(od.depositAmount) || 0));
  showModal(p ? '编辑收款 ' + (p.receiptNo || p.id) : '登记收款', `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">订单 *</label><select class="form-select" id="p_order" onchange="paymentPickOrder()">${orders.map(o => `<option value="${esc(o.id)}"${(p ? p.orderId : orderId) === o.id ? ' selected' : ''}>${esc(o.id)} — ${esc(o.customer)}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">款项类型</label><select class="form-select" id="p_type" onchange="paymentSuggest()">${selOpts(['定金', '尾款', '全额', '刀模费', '打样费', '运费'], p ? p.typeLabel : (type === 'final' ? '尾款' : '定金'))}</select></div>
      <div class="form-group"><label class="form-label">金额 (RM) *</label><input class="form-input" type="number" min="0" step="0.01" id="p_amount" value="${money2(p ? p.amount : suggest)}"></div>
      <div class="form-group"><label class="form-label">付款方式</label><select class="form-select" id="p_method">${selOpts(PAY_METHODS, p ? p.method : '银行转账')}</select></div>
      <div class="form-group"><label class="form-label">银行</label><input class="form-input" id="p_bank" value="${esc(p ? p.bankName : (docVal('settings_site').bank || ''))}" placeholder="e.g. Maybank"></div>
      <div class="form-group"><label class="form-label">收款账号</label><input class="form-input" id="p_account" value="${esc(p ? p.accountNo : (docVal('settings_site').bankAccount || ''))}"></div>
      <div class="form-group"><label class="form-label">收款户名</label><input class="form-input" id="p_holder" value="${esc(p ? p.accountName : (docVal('settings_site').enName || ''))}"></div>
      <div class="form-group"><label class="form-label">凭证号</label><input class="form-input" id="p_receipt" value="${esc(p ? p.receiptNo : '')}" placeholder="e.g. RCT-2026-001"></div>
      <div class="form-group"><label class="form-label">到账日期</label><input class="form-input" type="date" id="p_date" value="${esc((p && p.date) || today())}"></div>
      <div class="form-group"><label class="form-label">状态</label><select class="form-select" id="p_status">${selOpts(['已到账', '待确认', '已退回'], p ? { confirmed: '已到账', pending: '待确认', rejected: '已退回' }[p.status] : '已到账')}</select></div>
      <div class="form-group full"><label class="form-label">备注</label><textarea class="form-textarea" id="p_note" rows="2">${esc((p && p.note) || '')}</textarea></div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--gray-500)">标成「已到账」会同步更新订单的已收金额；定金到账后订单自动进入「已付定金」。</div>
  `, () => {
    const oid = val('p_order');
    const order = orders.find(x => x.id === oid);
    if (!order) { toast('请选择订单'); return false }
    const amount = parseFloat(val('p_amount')) || 0;
    if (amount <= 0) { toast('请填写金额'); return false }
    const typeLabel = val('p_type');
    const st = { '已到账': 'confirmed', '待确认': 'pending', '已退回': 'rejected' }[val('p_status')] || 'pending';
    const data = {
      orderId: oid, orderNo: order.id, customer: order.customer,
      type: /尾/.test(typeLabel) ? 'final' : (/定/.test(typeLabel) ? 'deposit' : (typeLabel === '全额' ? 'final' : 'other')),
      typeLabel, amount: +amount.toFixed(2), method: val('p_method'),
      bankName: val('p_bank'), accountNo: val('p_account'), accountName: val('p_holder'),
      date: val('p_date'), receiptNo: val('p_receipt'), status: st,
      note: (document.getElementById('p_note') || {}).value?.trim() || ''

    if (p) Object.assign(p, data);
    else payments.push(Object.assign({ id: DM.genId('PAY'), creator: whoami(), created: DM.now() }, data));

    syncOrderMoney(order);
    writeLog('登记收款', `${order.id} ${typeLabel} RM ${money2(amount)}（${val('p_status')}）`);
    toast('已保存');
    renderPage(currentPageId);
  });
}

function paymentSuggest() {
  const od = DM.get('orders').find(x => x.id === val('p_order'));
  const a = document.getElementById('p_amount');
  if (!od || !a) return;
  const got = orderReceived(od);
  const rest = +((Number(od.amount) || 0) - got).toFixed(2);
  const label = val('p_type') || '';
  if (/定/.test(label)) a.value = money2(Number(od.depositAmount) || 0);
  else if (/尾|全/.test(label)) a.value = money2(rest);
}

function paymentPickOrder() {
  const od = DM.get('orders').find(x => x.id === val('p_order'));
  const t = document.getElementById('p_type');
  if (!od || !t) return;
  const got = orderReceived(od);
  if (got <= 0 && (Number(od.depositAmount) || 0) > 0) t.value = '定金';
  else if (got < (Number(od.amount) || 0)) t.value = '尾款';
  paymentSuggest();
}

function confirmPayment(id) {
  const payments = DM.get('payments');

  const added = [];
  SHOWCASE_PRODUCTS.forEach(s => {
    if (hasId.has(s.id) || hasName.has(s.name.toLowerCase())) return;
    const c = pickCat(s.catKeys);
    added.push({ id:s.id, name:s.name, nameZh:s.nameZh, categoryId:c ? c.id : '', category:c ? c.name : '',
                 price:s.price, moq:s.moq, moqUnit:'pcs', status:'active', image:'', imagePath:'',
                 desc:s.desc, descZh:s.descZh });
  });
  if (!added.length) { toast('这 6 个商品已经都在列表里，没有重复添加'); return }
  DM.set('products', list.concat(added));
  writeLog('导入首页商品', added.map(p => p.name).join('、'));
  renderPage(currentPageId);
  toast(`已导入 ${added.length} 个商品${Sync.ready ? '，正在上传服务器…' : '（未连接后端，只存在这台设备上）'}`);
}

        category: categoryName,
        price: parseFloat(val('f_price')) || 0,
        moq: parseInt(val('f_moq')) || 0,
        moqUnit: val('f_moqUnit'),
        status: val('f_status'),
        image,
        imagePath,
        desc: val('f_desc'),
        descZh: val('f_descZh')
      });
    }
    DM.set('products', products);
    toast(p ? '商品已更新' : '商品已创建');

async function saveBannerBg(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const up = await cloudUpload(file, 'branding');
    const b = docVal('settings_banner');
    b.bg = up.url;
    b.bgPath = up.path;
    DM.set('settings_banner', b);
    const box = document.getElementById('fs_banner_bg_box');
    if (box) box.innerHTML = `<img src="${safeHref(up.url)}" alt="背景图" style="max-height:120px;max-width:100%;border:1px solid var(--gray-200);border-radius:6px;object-fit:cover"> <button class="btn btn-sm btn-secondary" onclick="removeBannerBg()">移除</button>`;
    toast('背景图已上传，保存文字后一起生效');
  } catch (e) {
    toast('背景图上传失败：' + e.message);
    input.value = '';
  }
}

function removeBannerBg() {
  const b = docVal('settings_banner');
  // 写空串而不是删键：拉取时按字段合并，删掉的键会被本机旧值补回来，等于移除无效
  b.bg = '';
  b.bgPath = '';
  DM.set('settings_banner', b);
  toast('已移除背景图，前台恢复默认背景');
  renderPage(currentPageId);
}

  `, async () => {
    const name = val('f_cl_name');
    if (!name) { toast('请填写品牌名称'); return false }
    const active = val('f_cl_active') === 'true';
    const file = document.getElementById('f_cl_logo')?.files?.[0];
    let logoUrl = cl ? (cl.logoUrl || '') : '';
    let logoPath = cl ? (cl.logoPath || '') : '';
    if (document.getElementById('f_cl_clear')?.checked) { logoUrl = ''; logoPath = '' }
    if (file) {
      if (!Sync.ready) { toast('未连接后端数据库，无法上传图片'); return false }

      const up = await cloudUpload(file, 'brand');
      logoUrl = up.url; logoPath = up.path;

let mediaSearch = '', mediaTypeFilter = '';

function mediaGridHtml(files) {
  if (!files.length) return `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">暂无文件</div>`;
  return files.map(f=>`<div style="border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;cursor:pointer" onclick="viewMediaFile('${f.id}')">${f.url && f.type==='image' ? `<img src="${safeHref(f.url)}" loading="lazy" style="width:100%;height:100px;object-fit:cover;display:block">` : `<div style="height:100px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:24px">${f.type==='image'?'🖼️':f.type==='pdf'?'📄':'📁'}</div>`}<div style="padding:8px;font-size:11px;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div></div>`).join('');
}

function applyMediaFilter() {
  const grid = document.getElementById('mediaGrid');
  if (!grid) return;
  let files = DM.get('mediaFiles');
  if (mediaSearch) files = files.filter(f => f.name.toLowerCase().includes(mediaSearch));
  if (mediaTypeFilter) files = files.filter(f => f.type === mediaTypeFilter);
  grid.innerHTML = mediaGridHtml(files);
}

function filterMedia(v) { mediaSearch = (v||'').toLowerCase(); applyMediaFilter(); }
function filterMediaType(v) { mediaTypeFilter = v||''; applyMediaFilter(); }

function openMediaUpload() {
  showModal('上传文件', `
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">选择文件 *</label><input class="form-input" type="file" id="f_media_file"></div>
      <div class="form-group"><label class="form-label">文件分类</label><select class="form-select" id="f_media_type"><option value="image">图片</option><option value="pdf">PDF</option><option value="other">其他</option></select></div>
      <div class="form-group"><label class="form-label">备注名称</label><input class="form-input" id="f_media_name" placeholder="可选，留空使用文件名"></div>
    </div>
    <div style="margin-top:12px;padding:10px;background:var(--gray-50);border-radius:6px;font-size:12px;color:var(--gray-500)">文件上传后存放在云端，所有同事和官网都能直接访问。单个文件上限 20MB。</div>
  `, async () => {
    const fileInput = document.getElementById('f_media_file');
    const file = fileInput?.files?.[0];
    if (!file) { toast('请先选择文件'); return false }
    const type = val('f_media_type');
    closeModal();
    toast('正在上传 ' + file.name + ' …');
    try {
      const up = await cloudUpload(file, 'media');
      const files = DM.get('mediaFiles');
      files.unshift({id:DM.genId('MED'),name:val('f_media_name') || file.name,type,size:fmtSize(file.size),uploaded:new Date().toISOString().slice(0,10),url:up.url,path:up.path,uploader:whoami()});

      toast('已上传到云端'); renderPage(currentPageId);

function renderCasesCategories(c) {

  c.innerHTML = `

function addCaseCategory() {
  showModal('新建案例分类', `
    <div class="form-group"><label class="form-label">分类名称 *</label><input class="form-input" id="f_casecat" placeholder="e.g. Healthcare"></div>
  `, () => {
    const name = val('f_casecat');
    if (!name) { toast('请输入分类名称'); return; }
    const cats = DM.get('caseCategories');
    if (cats.includes(name)) { toast('分类已存在'); return; }
    cats.push(name);

    toast('分类已添加'); renderPage(currentPageId);
  });

function editCaseCategory(idx) {
  const cats = DM.get('caseCategories');
  const old = cats[idx];
  if (old === undefined) return;
  showModal('编辑分类', `
    <div class="form-group"><label class="form-label">分类名称</label><input class="form-input" id="f_casecat_edit" value="${esc(old)}"></div>
    <div style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="deleteCaseCategory(${idx})">删除此分类</button></div>
  `, () => {
    const name = val('f_casecat_edit');
    if (!name) { toast('请输入名称'); return; }
    const list = DM.get('caseCategories');
    if (list[idx] === undefined) { toast('分类已变动，请重新打开'); return; }
    list[idx] = name;
    DM.set('caseCategories', list);
    toast('分类已更新'); renderPage(currentPageId);
  });
}

function deleteCaseCategory(idx) {
  const cats = DM.get('caseCategories');
  const name = cats[idx];
  if (name === undefined) { toast('分类已变动，请刷新页面'); return; }
  if (!confirm('确定删除「' + name + '」？')) return;
  cats.splice(idx, 1);
  DM.set('caseCategories', cats);
  toast('已删除'); closeModal(); renderPage(currentPageId);
}

function val(id) { return document.getElementById(id)?.value?.trim() || '' }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function money2(n) { return (Number(n) || 0).toFixed(2) }
// 云端地址是后台可编辑字段，挡掉 javascript: 这类伪协议，只放行 http(s) 和站内路径
function safeHref(u) {
  const s = String(u ?? '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s)) return esc(s);
  if (s.indexOf('//') === 0) return '';
  if (s.split(/[?#]/)[0].split('/')[0].indexOf(':') !== -1) return '';
  return esc(s.replace(/ /g, '%20'));
}

function showModal(title, bodyHtml, onSave, buttons) {
  const modal = document.getElementById('modal');

  const footerBtns = buttons ? buttons.map(b=>`<button class="btn ${b.cls}" id="modal-btn-${b.label}">${esc(b.label)}</button>`).join('') :
    `<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" id="modalSaveBtn">保存</button>`;

    <div class="modal-body">${bodyHtml}</div>

  overlay.classList.add('active');
  if (buttons) {
    buttons.forEach(b => {
      document.getElementById('modal-btn-' + b.label)?.addEventListener('click', b.fn);

  } else if (onSave) {
    document.getElementById('modalSaveBtn')?.addEventListener('click', async e => {

function exportCSV(type) {
  let data = [];
  if (type === 'leads') data = DM.get('leads');
  else if (type === 'orders') data = DM.get('orders');
  else if (type === 'quotes') data = DM.get('quotes');
  if (!data.length) { toast('无数据可导出'); return; }
  const keys = Object.keys(data[0]).filter(k => k !== 'followUps' && !Array.isArray(data[0][k]));
  const csv = [keys.join(','), ...data.map(row => keys.map(k => '"'+(row[k]??'')+'"').join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = type + '_export_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('已导出 ' + data.length + ' 条记录');
}
function readCsvText(file) {
  return file.arrayBuffer().then(buf => {
    let text = new TextDecoder('utf-8', {fatal: false}).decode(buf);
    if (text.includes('\uFFFD')) text = new TextDecoder('gbk').decode(buf);
    return text;
  });
}

function parseDelimited(text) {
  const norm = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const first = norm.split('\n').find(l => l.trim()) || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < norm.length; i++) {
    const ch = norm[i];
    if (inQ) {
      if (ch === '"') { if (norm[i + 1] === '"') { cell += '"'; i++ } else inQ = false }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === delim) { row.push(cell); cell = '' }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = '' }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));
}

function applyPricebookCsv(text, defaultBox, pb) {
  const rows = parseDelimited(text);
  if (rows.length < 2) return {ok: false, msg: '文件至少要有表头和一行数据'};
  let hi = rows.findIndex(r => r.some(c => /sku|编号|型号|款号/i.test(c)));
  if (hi < 0) hi = 0;
  const head = rows[hi].map(h => h.toLowerCase());
  const digits = h => (h.match(/\d+/g) || []).join('');
  const find = re => head.findIndex(h => re.test(h));
  const cSku = find(/sku|编号|型号|款号/);
  const cSize = find(/尺寸|规格|size/);
  const cBox = find(/盒型|箱型|类型|box/);
  const tierCols = PB_TIERS.map(t => head.findIndex(h => digits(h) === t));
  if (tierCols.every(c => c < 0)) return {ok: false, msg: '没找到 100/300/500/1000/2000/3000/5000pcs 数量列'};
  const skuCol = cSku < 0 ? 0 : cSku;
  let added = 0, updated = 0, skipped = 0;
  const boxes = new Set();
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const sku = (r[skuCol] || '').trim();
    const box = ((cBox >= 0 && r[cBox]) ? r[cBox] : (defaultBox || '')).trim();
    if (!sku || !box) { skipped++; continue }
    pb[box] = pb[box] || [];
    const prices = tierCols.map(c => {
      if (c < 0) return '';
      const n = parseFloat(String(r[c] ?? '').replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? '' : n;
    });
    if (prices.every(p => p === '')) { skipped++; continue }
    let row = pb[box].find(x => String(x.sku).toLowerCase() === sku.toLowerCase());
    if (row) {
      row.p = row.p || PB_TIERS.map(() => '');
      if (cSize >= 0 && r[cSize]) row.size = r[cSize];
      prices.forEach((v, pi) => { if (v !== '') row.p[pi] = v });
      updated++;
    } else {
      pb[box].push({sku, size: cSize >= 0 ? (r[cSize] || '') : '', p: prices});
      added++;
    }
    boxes.add(box);
  }
  if (!added && !updated) return {ok: false, msg: '没有匹配到任何有效 SKU 行'};
  return {ok: true, pb, added, updated, skipped, total: rows.length - hi - 1, boxes: [...boxes]};
}

function uploadCert(name) {
  showModal('上传证书 - ' + name, `
    <div class="form-group"><label class="form-label">选择证书文件</label><input class="form-input" type="file" id="f_cert_file" accept="image/*,.pdf"></div>
    <div style="margin-top:12px;padding:10px;background:var(--gray-50);border-radius:6px;font-size:12px;color:var(--gray-500)">上传成功后证书缩略图会出现在列表里，再点「替换」即覆盖为新文件。</div>
  `, async () => {
    const file = document.getElementById('f_cert_file')?.files?.[0];
    if (!file) { toast('请选择文件'); return false }
    closeModal();
    toast('正在上传 ' + file.name + ' …');
    try {
      const up = await cloudUpload(file, 'certs');
      const stored = docVal('settings_certs');
      stored[name] = { url: up.url, path: up.path, fileName: file.name, type: file.type.startsWith('image/') ? 'image' : 'pdf', uploaded: DM.now().split(' ')[0], by: whoami() };
      DM.set('settings_certs', stored);
      toast(name + ' 已上传到云端'); renderPage(currentPageId);
    } catch (e) { toast('上传失败：' + e.message) }
  });
}

// ========== 后端状态页 ==========
function renderSettingsCloud(c) {
  const cfg = window.JL_SB || {};
  c.innerHTML = `
    <div class="page-header"><div><h1 class="page-title">后端状态</h1><p class="page-desc">数据库连接、数据同步与账号</p></div></div>
    ${Sync.ready
      ? `<div class="banner" style="background:#e8f5ee;border:1px solid #b7dfc6;color:var(--primary)">已连接 Supabase，数据全员共享。上次拉取：${Sync.lastPull ? new Date(Sync.lastPull).toLocaleString('zh-CN') : '—'}</div>`
      : `<div class="banner banner-err">未连接后端数据库。当前录入的内容只保存在这台设备的浏览器里，同事看不到，换电脑也会丢。<br>状态：${Sync.msg || '未配置'}${Sync.errMsg ? ' · ' + Sync.errMsg : ''}</div>`}
    <div class="card mb-20"><div class="card-header"><span class="card-title">连接信息</span></div><div class="card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
        <div><strong>Project URL</strong><br><span style="color:var(--gray-500);word-break:break-all">${esc(cfg.url || '未填写')}</span></div>
        <div><strong>anon key</strong><br><span style="color:var(--gray-500)">${cfg.key ? cfg.key.slice(0,10) + '…（已配置）' : '未填写'}</span></div>
      </div>
      <div style="margin-top:16px;font-size:12px;color:var(--gray-500);line-height:1.9">
        配置方法：编辑项目根目录下的 <code>js/sb-config.js</code>，把 Supabase 的 Project URL 与 anon public key 填进去，重新部署后刷新本页。<br>
        建表脚本在 <code>supabase/schema.sql</code>，粘贴到 Supabase 控制台 SQL Editor 执行一次即可，可重复执行。
      </div>
    </div></div>
    <div class="card mb-20"><div class="card-header"><span class="card-title">数据同步</span></div><div class="card-body">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="syncOnChipClick()">从服务器拉取最新</button>
        <button class="btn btn-secondary" onclick="Sync.retry()">重试未完成的上传</button>
        <button class="btn btn-secondary" onclick="importDemoData()">导入演示数据（测试用）</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--gray-500)">待上传 ${Sync.q.length} 条 · 失败 ${Sync.fails} 条 · 托管集合 ${CLOUD.row.length + CLOUD.doc.length} 个</div>
    </div></div>
    ${localStorage.getItem('jl_presync_backup') ? `
    <div class="card"><div class="card-header"><span class="card-title">本机旧数据</span></div><div class="card-body">
      <div style="font-size:13px;color:var(--gray-600);margin-bottom:12px">检测到后端开通前本机已录入的内容，尚未共享给同事。</div>
      <button class="btn btn-primary" onclick="doMigrateUp()">上传到服务器</button>
      <button class="btn btn-secondary" onclick="discardLocalBackup()">丢弃本机旧数据</button>
    </div></div>` : ''}`;
}

async function doMigrateUp() {
  toast('正在上传本机数据…');
  try {
    const n = await Sync.migrateLocalUp();
    if (Sync.q.length) { toast('部分上传失败，可稍后点右上角重试'); return }
    toast('已上传 ' + n + ' 项数据到服务器');
    renderPage(currentPageId);
  } catch (e) { toast('上传失败：' + e.message) }
}

function discardLocalBackup() {
  if (!confirm('确定丢弃本机旧数据？这些内容不会共享给同事，且无法恢复。')) return;
  localStorage.removeItem('jl_presync_backup');
  localStorage.setItem('jl_migrated_up', '1');
  toast('已忽略本机旧数据'); renderPage(currentPageId);
}

function importDemoData() {
  if (!confirm('导入演示数据？会用 L\'Oréal、Shopee 等假线索覆盖当前业务数据，仅供测试，事后可逐条删除。')) return;
  SEED_FORCE = true;
  seedData();
  SEED_FORCE = false;
  toast('演示数据已导入');
  renderPage(currentPageId);
}

// ========== INIT ==========
function paintUser() {
  const name = whoami();
  const n = document.getElementById('userName');
  const a = document.getElementById('userAvatar');
  if (n) n.textContent = name;
  if (a) a.textContent = (name[0] || '管').toUpperCase();
}

function startSessionGuard() {
  if (!Sync.ready) return;
  Sync.client.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') window.location.href = 'login.html';
    if (event === 'SIGNED_IN' && session) Sync.user = session.user;
  });
}

async function bootAdmin() {
  const ok = await Sync.init();
  Sync.muted = true;
  if (ok) {
    let user = null;
    try { user = await Sync.currentUser() } catch (e) {}
    if (!user) { window.location.href = 'login.html?reason=expired'; return }
    Sync.user = user;
    try {
      Sync.pendingLocal = Sync.snapshotLocal();
      await Sync.pullAll();
    } catch (e) { Sync.msg = '拉取失败'; Sync.errMsg = e.message }
  } else if (localStorage.getItem('jiulian_admin_token') !== 'authenticated') {
    window.location.href = 'login.html';
    return;
  }
  seedData();
  Sync.muted = false;
  // 云端还没人建过的字典（盒型/材质/印刷/工艺…）刚被 seedData 补上默认值，
  // 现在静音已解除，把它们推上服务器，同事登录后拿到的就是同一份选项。
  if (ok && DICT_HEALED.length) {
    DICT_HEALED.forEach(k => Sync.track(k, [], DM.get(k)));
    DICT_HEALED.length = 0;
  }
  renderSidebar();
  navigateTo('dashboard-overview', '数据看板', '概览');
  toggleGroup('dashboard');
  Sync.badge();
  paintUser();
  startSessionGuard();
  if (ok && Sync.pendingLocal) {
    showBanner('warn', `本机存有 <strong>${esc(Sync.pendingLocal)}</strong> 项后端开通前录入的数据，尚未共享给同事。<button onclick="doMigrateUp()">上传到服务器</button>`);
  } else if (!ok) {
    showBanner('warn', `未连接后端数据库，你现在录入的内容只保存在这台设备上，同事看不到。<button onclick="navigateTo('settings-cloud','系统设置','后端状态')">查看配置方法</button>`);
  } else if (Sync.errMsg) {
    showBanner('err', `后端异常：${Sync.errMsg}<button onclick="location.reload()">重试</button>`);
  }
  if (Sync.fails) setTimeout(() => Sync.retry(), 3000);
}

bootAdmin();
</script>
