<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<title>玖联外勤</title>
<script src="js/sb-config.js"></script>
<script src="js/field-model.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
  --orange-600: #ea580c; --orange-500: #f97316; --orange-50: #fff7ed;
  --gray-900: #111827; --gray-700: #374151; --gray-600: #4b5563; --gray-500: #6b7280;
  --gray-400: #9ca3af; --gray-300: #d1d5db; --gray-200: #e5e7eb; --gray-100: #f3f4f6; --gray-50: #f9fafb;
  --green-600: #059669; --red-600: #dc2626;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--gray-50); color: var(--gray-900); font-size: 15px; line-height: 1.5;
  overscroll-behavior-y: none;
}
[hidden] { display: none !important; }
#app { display: flex; flex-direction: column; min-height: 100%; }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--orange-600); color: #fff;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; gap: 10px;
}
.topbar h1 { font-size: 17px; font-weight: 700; flex: 1; }
.topbar .chip {
  font-size: 12px; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
}
.topbar .chip.warn { background: #fff; color: var(--red-600); font-weight: 700; }

/* ---------- 主体 ---------- */
#view { flex: 1; padding: 14px 14px 20px; max-width: 560px; width: 100%; margin: 0 auto; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-title .more { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--orange-600); background: none; border: 0; }
.muted { color: var(--gray-500); font-size: 13px; }
.empty { text-align: center; color: var(--gray-400); font-size: 14px; padding: 22px 10px; }

/* 待办 / 统计 */
.todo { display: flex; align-items: center; gap: 12px; }
.todo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray-300); flex: none; }
.todo.on .dot { background: var(--green-600); }
.todo .t { flex: 1; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--gray-50); border-radius: 10px; padding: 12px; }
.stat b { display: block; font-size: 22px; font-weight: 800; color: var(--orange-600); line-height: 1.2; }
.stat span { font-size: 12px; color: var(--gray-500); }

/* ---------- 表单 ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--gray-600); margin-bottom: 5px; font-weight: 600; }
.field label .req { color: var(--red-600); }
input[type=text], input[type=tel], input[type=email], input[type=password], input[type=date],
input[type=datetime-local], input[type=number], select, textarea {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--gray-200); border-radius: 10px;
  font-size: 15px; font-family: inherit; background: #fff; color: var(--gray-900); -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--gray-400) 50%), linear-gradient(135deg, var(--gray-400) 50%, transparent 50%);
  background-position: calc(100% - 18px) 19px, calc(100% - 12px) 19px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
textarea { min-height: 78px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange-500); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }

.btn {
  display: block; width: 100%; padding: 13px 16px; border: 0; border-radius: 11px;
  background: var(--orange-600); color: #fff; font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
}
.btn:disabled { opacity: .55; }
.btn.ghost { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-200); font-size: 15px; font-weight: 600; }
.btn.sm { width: auto; display: inline-block; padding: 7px 14px; font-size: 14px; border-radius: 9px; }
.btn-row { display: flex; gap: 10px; }

/* ---------- 列表条目 ---------- */
.item { padding: 13px 0; border-bottom: 1px solid var(--gray-100); display: flex; align-items: flex-start; gap: 10px; }
.item:last-child { border-bottom: 0; }
.item .body { flex: 1; min-width: 0; }
.item .name { font-size: 15px; font-weight: 600; word-break: break-word; }
.item .sub { font-size: 12.5px; color: var(--gray-500); margin-top: 3px; word-break: break-word; }
.item .right { text-align: right; flex: none; }
.tag { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--orange-50); color: var(--orange-600); font-weight: 600; }
.tag.gray { background: var(--gray-100); color: var(--gray-500); }
.tag.green { background: #ecfdf5; color: var(--green-600); }
.tag.red { background: #fef2f2; color: var(--red-600); }

/* ---------- 底部导航 ---------- */
#tabbar {
  position: sticky; bottom: 0; z-index: 30; display: flex; background: #fff; border-top: 1px solid var(--gray-200);
  padding-bottom: var(--safe-b);
}
#tabbar button {
  flex: 1; background: none; border: 0; padding: 8px 2px 7px; font-size: 11.5px; color: var(--gray-500);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; cursor: pointer;
}
#tabbar button .ico { font-size: 19px; line-height: 1.1; }
#tabbar button.on { color: var(--orange-600); font-weight: 700; }
#tabbar button .badge { position: absolute; transform: translate(14px,-24px); background: var(--red-600); color: #fff;
  font-size: 10px; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px; padding: 0 4px; font-weight: 700; }

/* ---------- 登录 ---------- */
.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 28px 22px; background: #fff; }
.login .brand { font-size: 22px; font-weight: 800; color: var(--orange-600); margin-bottom: 4px; }
.login .tip { font-size: 13px; color: var(--gray-500); margin-bottom: 26px; }
.login .err { font-size: 13px; color: var(--red-600); background: #fef2f2; border-radius: 9px; padding: 9px 11px; margin-bottom: 14px; }

/* ---------- 弹层 ---------- */
#sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; }
.sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet-body {
  position: relative; background: #fff; width: 100%; max-height: 88vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + var(--safe-b));
}
.sheet-head { display: flex; align-items: center; margin-bottom: 14px; }
.sheet-head h3 { font-size: 16px; font-weight: 700; flex: 1; }
.sheet-head button { background: none; border: 0; font-size: 22px; color: var(--gray-400); line-height: 1; padding: 2px 8px; }
.kv { display: flex; gap: 10px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--gray-100); }
.kv b { color: var(--gray-500); font-weight: 500; width: 82px; flex: none; font-size: 13px; }
.kv span { flex: 1; word-break: break-word; }

#lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ---------- 打卡 / 客户 ---------- */
.photo-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 18px 12px;
  border: 1.5px dashed var(--gray-300); border-radius: 11px; background: var(--gray-50); color: var(--gray-600);
  font-size: 14.5px; font-family: inherit; cursor: pointer;
}
.photo-btn.on { border-color: var(--green-600); border-style: solid; color: var(--green-600); background: #ecfdf5; font-weight: 600; }
.photo-btn:disabled { opacity: .6; }
#ckPrev { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; background: #000; display: block; margin-top: 10px; }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.thumbs img { width: 100%; height: 74px; object-fit: cover; border-radius: 8px; background: var(--gray-100); }
.tl { position: relative; padding-left: 16px; }
.tl::before { content: ''; position: absolute; left: 4px; top: 7px; bottom: 8px; width: 1.5px; background: var(--gray-200); }
.tl-item { position: relative; padding-bottom: 15px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ''; position: absolute; left: -16px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--orange-500); }
.tl-item .t { font-size: 14.5px; font-weight: 600; }
.tl-item .m { font-size: 13.5px; color: var(--gray-700); margin-top: 3px; word-break: break-word; white-space: pre-wrap; }
.tl-item .d { font-size: 12px; color: var(--gray-400); margin-top: 3px; }

.toast {
  position: fixed; left: 50%; bottom: calc(78px + var(--safe-b)); transform: translateX(-50%); z-index: 90;
  background: rgba(17,24,39,.92); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 22px;
  max-width: 84vw; text-align: center;
}
.toast.bad { background: var(--red-600); }
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="brand">玖联外勤</div>
  <div class="tip">用公司给的账号登录（与电脑后台同一个账号）</div>
  <div id="loginErr" class="err" hidden></div>
  <div class="field">
    <label for="liEmail">邮箱</label>
    <input id="liEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="name@jiulianpack.com.my">
  </div>
  <div class="field">
    <label for="liPass">密码</label>
    <input id="liPass" type="password" autocomplete="current-password" placeholder="登录密码">
  </div>
  <button class="btn" id="liBtn" type="button">登录</button>
</div>

<div id="app" hidden>
  <header class="topbar">
    <h1 id="pageTitle">首页</h1>
    <span class="chip" id="userChip"></span>
    <span class="chip warn" id="pendChip" hidden></span>
  </header>
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>

<div id="sheet" hidden>
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="lightbox" hidden><img id="lightboxImg" alt="门头照片"></div>
<div id="toast" class="toast" hidden></div>

<script>
// ============================================================
// 玖联外勤手机端。与 admin.html 共用 jl_records（一条记录一行 + payload），
// 只读写 field_ 前缀的五个集合，本地镜像用同一批 jl_field_* 键，
// 所以同一台设备上后台和外勤页看到的是同一份缓存。
// ============================================================
var SB = { client: null, user: null, ready: false };
var LS = {
  get: function (k, def) { try { var v = JSON.parse(localStorage.getItem('jl_' + k)); return (v === null || v === undefined) ? def : v } catch (e) { return def } },
  raw: function (k, v) { localStorage.setItem('jl_' + k, JSON.stringify(v)) }
};
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var $ = function (s) { return document.querySelector(s) };
var toastTimer = null;
function toast(msg, bad) {
  var t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true }, 2600);
}
function rowsOf(col) { var v = LS.get(col, []); return Array.isArray(v) ? v : [] }
function me() { return fieldOwner() }

// ---------- 待办队列：外勤现场信号差，写失败的先记本地，联网后重放 ----------
function queueAll() { var q = LS.get('field_queue', []); return Array.isArray(q) ? q : [] }
function queuePut(op) {
  var q = queueAll();
  // 同一行只留最后一次意图，否则一次新增会攒出一串重复上传
  var key = op.rid + '|' + op.t;
  var next = q.filter(function (x) { return (x.rid + '|' + x.t) !== key });
  next.push(op);
  LS.raw('field_queue', next);
  paintPending();
}
function queueDrop(op) {
  var key = op.rid + '|' + op.t;
  LS.raw('field_queue', queueAll().filter(function (x) { return (x.rid + '|' + x.t) !== key }));
  paintPending();
}
function paintPending() {
  var n = queueAll().length, chip = $('#pendChip');
  chip.hidden = !n; chip.textContent = n + ' 条待上传';
}
async function send(op) {
  if (!SB.client) return false;
  var res;
  try {
    res = op.t === 'del'
      ? await SB.client.from('jl_records').delete().eq('id', op.rid)
      : await SB.client.from('jl_records').upsert(
          { id: op.rid, collection: op.col, payload: op.payload, updated_at: new Date().toISOString() }, { onConflict: 'id' });
  } catch (e) { res = { error: { message: e.message } } }
  if (res && res.error) { queuePut(op); toast('没传上去，已存本机稍后重试：' + res.error.message, true); return false }
  queueDrop(op); return true;
}
async function flushQueue() {
  var q = queueAll(); if (!q.length || !SB.client) return;
  // 逐条重放：send 成功会把这条从队列摘掉，失败会留在队列里并停下，
  // 绝不能开工就清空队列——那样第一条失败后，后面没轮到的就永久丢了。
  for (var i = 0; i < q.length; i++) { if (!(await send(q[i]))) return }
  toast('待上传的记录已补齐');
}

// ---------- 本地写 + 上云 ----------
function putLocal(col, row) {
  var arr = rowsOf(col), at = -1;
  for (var i = 0; i < arr.length; i++) { if (String(arr[i].id) === String(row.id)) { at = i; break } }
  if (at >= 0) arr[at] = row; else arr.unshift(row);
  LS.raw(col, arr);
}
async function saveRow(col, row) { putLocal(col, row); render(); return await send({ t: 'row', col: col, rid: col + ':' + row.id, payload: row }) }

// ---------- 拉取：只拉外勤这五个集合，不把全公司数据往手机上灌 ----------
async function pullAll() {
  var rows = [], PAGE = 500;
  for (var from = 0; ; from += PAGE) {
    var r = await SB.client.from('jl_records').select('id,collection,payload')
      .in('collection', FIELD_COLS).range(from, from + PAGE - 1).order('id');
    if (r.error) throw new Error(r.error.message);
    rows = rows.concat(r.data || []);
    if (!r.data || r.data.length < PAGE) break;
  }
  var by = {}; FIELD_COLS.forEach(function (k) { by[k] = [] });
  rows.forEach(function (x) { if (by[x.collection]) by[x.collection].push(x.payload) });
  // 队列里还没传出去的改动比云端新，别让拉取把它们冲掉
  queueAll().forEach(function (op) {
    if (!by[op.col]) return;
    if (op.t === 'del') { by[op.col] = by[op.col].filter(function (p) { return String(p.id) !== String(op.rid.split(':')[1]) }) }
    else {
      var hit = false;
      by[op.col] = by[op.col].map(function (p) { if (String(p.id) !== String(op.payload.id)) return p; hit = true; return op.payload });
      if (!hit) by[op.col].unshift(op.payload);
    }
  });
  FIELD_COLS.forEach(function (k) { LS.raw(k, by[k]) });
  return rows.length;
}

// ---------- 登录 ----------
function showLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false;
  var e = $('#loginErr'); e.hidden = !msg; if (msg) e.textContent = msg;
}
async function doLogin() {
  var email = $('#liEmail').value.trim().toLowerCase(), pass = $('#liPass').value;
  if (!email || !pass) { showLogin('邮箱和密码都要填'); return }
  var btn = $('#liBtn'); btn.disabled = true; btn.textContent = '登录中…';
  try {
    var r = await SB.client.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) throw new Error(r.error.message);
    if (!r.data.session) throw new Error('这个账号还没确认邮箱，请让主管在后台重发一次确认邮件');
    await enterApp(r.data.session.user);
  } catch (e) {
    showLogin(e.message || '登录失败');
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}
async function doLogout() {
  try { await SB.client.auth.signOut() } catch (e) {}
  localStorage.removeItem('jiulian_field_user');
  location.reload();
}

async function enterApp(user) {
  SB.user = user;
  localStorage.setItem('jiulian_field_user', JSON.stringify({ id: user.id, email: user.email, name: (user.user_metadata && user.user_metadata.name) || (user.email || '').split('@')[0] }));
  $('#login').hidden = true; $('#app').hidden = false;
  $('#userChip').textContent = (user.user_metadata && user.user_metadata.name) || (user.email || '').split('@')[0];
  paintPending();
  try { await pullAll() } catch (e) { toast('云端数据没拉到：' + e.message, true) }
  await flushQueue();
  render();
}

// ---------- 路由 ----------
var TABS = [
  { id: 'home',    ico: '🏠', label: '首页' },
  { id: 'trip',    ico: '📋', label: '报备' },
  { id: 'checkin', ico: '📍', label: '打卡' },
  { id: 'cust',    ico: '🏢', label: '客户' },
  { id: 'me',      ico: '👤', label: '我的' }
];
var TAB_TITLE = { home: '首页', trip: '外出报备', checkin: '拜访打卡', cust: '客户档案', me: '我的' };
var tab = LS.get('field_tab', 'home');
if (TABS.every(function (t) { return t.id !== tab })) tab = 'home';

function paintTabs() {
  $('#tabbar').innerHTML = TABS.map(function (t) {
    return '<button type="button" class="' + (t.id === tab ? 'on' : '') + '" data-tab="' + t.id + '"><span class="ico">' + t.ico + '</span><span>' + t.label + '</span></button>';
  }).join('');
  $('#pageTitle').textContent = TAB_TITLE[tab];
}
function go(t) { tab = t; LS.raw('field_tab', t); render(); window.scrollTo(0, 0) }
function render() {
  if (!SB.user) return;
  paintTabs();
  var fn = SCREENS[tab] || SCREENS.home;
  $('#view').innerHTML = fn();
  // 照片存在模块变量里，重画后补回预览区（表单其余部分重画即重置，是提交成功后的预期行为）
  if (tab === 'checkin') paintPhoto();
}

// ---------- 公共片段 ----------
function tripLabel(t) { return (t.area || '未填区域') + ' · ' + (t.visitType || '陌拜') }
function tripsOfMine() {
  var id = me().id;
  return rowsOf('field_trips').filter(function (t) { return !id || String(t.ownerId) === String(id) })
    .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)) });
}
function checkinsOf(tripId) {
  return rowsOf('field_checkins').filter(function (c) { return String(c.tripId) === String(tripId) })
    .sort(function (a, b) { return String(a.at).localeCompare(String(b.at)) });
}
function monthPrefix() { return fieldToday().slice(0, 7) }
function mineRows(col) {
  var id = me().id;
  return rowsOf(col).filter(function (r) { return !id || String(r.ownerId) === String(id) });
}
function customersOfMine() {
  return mineRows('field_customers').sort(function (a, b) { return String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')) });
}
function findRow(col, id) {
  return rowsOf(col).filter(function (r) { return String(r.id) === String(id) })[0];
}
function followupsOf(custId) {
  return rowsOf('field_followups').filter(function (f) { return String(f.custId) === String(custId) })
    .sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')) });
}
function checkinsOfCust(custId) {
  return rowsOf('field_checkins').filter(function (c) { return String(c.custId) === String(custId) })
    .sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')) });
}

// ---------- 提交一组记录 ----------
// 一次业务动作要写多行时（比如建档同时要落一条跟单）用这个：
// 先全部落本地再逐行上传，中途不 render()——重画会把用户刚填的表单清空。
async function commitRows(list) {
  list.forEach(function (p) { putLocal(p[0], p[1]) });
  var ok = true;
  for (var i = 0; i < list.length; i++) {
    if (!(await send({ t: 'row', col: list[i][0], rid: list[i][0] + ':' + list[i][1].id, payload: list[i][1] }))) ok = false;
  }
  return ok;
}

// ---------- 门头照上传 ----------
// 走后台在用的 jl-uploads 公开桶（第 1 期与主管确认过：接受公开链接，第 2 期换私有桶）。
async function uploadPhoto(file) {
  if (!SB.client) throw new Error('没连上后端，传不了照片');
  var c = await fieldCompressImage(file, 1280);
  var safe = String(c.name || 'photo.jpg').replace(/[^\w.\-]+/g, '_').slice(-60);
  var path = 'field/' + fieldToday().replace(/-/g, '') + '-' + Date.now().toString(36) + '-' + safe;
  var r = await SB.client.storage.from('jl-uploads').upload(path, c.blob, { upsert: false, contentType: 'image/jpeg' });
  if (r.error) throw new Error(r.error.message);
  return {
    path: r.data.path, name: safe, width: c.width, height: c.height,
    url: SB.client.storage.from('jl-uploads').getPublicUrl(r.data.path).data.publicUrl
  };
}

  var rows = [];
  if (f.custId === '__new') {
    var c = {

      addr: '', business: '', contact: '', phone: '', need: '', level: '',

    };
    rows.push(['field_customers', c]);
    // 第 5 步：一建档就自动落一条跟单，跟单总表里不会出现「有客户没记录」的空档
    rows.push(['field_followups', {

      at: now, method: '上门', content: '现场打卡建档（' + (f.trip.visitType || '拜访') + ' · ' + (f.trip.area || '未填区域') + '）',
      level: '', nextDate: '', tripId: f.trip.id, createdAt: now
    }]);
    f.custId = c.id;
  }
  rows.push(['field_checkins', {
    id: fieldId('FI'), ownerId: o.id, ownerName: o.name, tripId: f.trip.id, tripDate: f.trip.date,
    tripArea: f.trip.area, custId: f.custId, custName: f.custName, at: now,
    photoPath: ckPhoto.path, photoUrl: ckPhoto.url, photoW: ckPhoto.width, photoH: ckPhoto.height,
    createdAt: now
  }]);
  var ok = await commitRows(rows);
  ckBusy = false;
  if (ok) { ckPhoto = null; toast('打卡成功'); render(); }
  else toast('记录已存本机，联网后会自动补传', true);
}

  if (!c) { toast('这条客户档案不在了', true); return }
  var at = $('#ffAt').value, method = $('#ffMethod').value, content = $('#ffContent').value.trim();
  if (!at) { toast('请选择跟进时间', true); return }
  if (!method) { toast('请选择跟进方式', true); return }
  if (!content) { toast('请填写沟通内容', true); return }
  var o = me();
  if (!o.id) { toast('登录状态丢了，请重新登录', true); return }
  var now = fieldNow(), level = $('#ffLevel').value, next = $('#ffNext').value;
  var rows = [['field_followups', {
    id: fieldId('FF'), ownerId: o.id, ownerName: o.name, custId: c.id, custCompany: c.company,
    at: at.replace('T', ' '), method: method, content: content, level: level, nextDate: next,
    tripId: '', createdAt: now
  }]];
  // 跟单里定了等级就同步回档案，客户列表和后台客户库看到的等级始终是最新一次跟盘的结论
  if (level && level !== c.level) rows.push(['field_customers', Object.assign({}, c, { level: level, updatedAt: now })]);
  var btn = $('#ffSave'); if (btn) { btn.disabled = true; btn.textContent = '保存中…' }
  var ok = await commitRows(rows);
  doneSaving(btn, '保存跟单', ok, '跟单已记录');
  closeSheet(); render();
}

    }).join('') + '</div>';
  } else h += '<div class="empty">还没有跟单</div>';
  openSheet(h);
}

          + '<div class="sub">' + esc(String(f.content || '').slice(0, 60)) + (f.nextDate ? ' · 下次 ' + esc(f.nextDate) : '') + '</div></div>'
          + (f.custId ? '<div class="right"><button class="btn sm ghost" type="button" data-cust="' + esc(f.custId) + '">客户</button></div>' : '')

// ---------- 弹层 ----------

function closeSheet() { $('#sheet').hidden = true; $('#sheetBody').innerHTML = ''; document.body.style.overflow = '' }

          + (c.photoUrl ? '<div class="right"><img src="' + esc(c.photoUrl) + '" alt="门头照片" data-photo="' + esc(c.photoUrl) + '" style="width:56px;height:42px;object-fit:cover;border-radius:6px">' + '</div>' : '')
          + '</div>';

var SCREENS = { home: screenHome, trip: screenTrip, checkin: screenCheckin, cust: screenCust, me: screenMe };

// ---------- 事件（全部委托，屏内容重画不用重新绑定） ----------
document.addEventListener('click', function (e) {
  var goTab = e.target.closest('[data-go]');
  if (goTab) { closeSheet(); go(goTab.getAttribute('data-go')); return }
  var tb = e.target.closest('#tabbar button');
  if (tb) { go(tb.getAttribute('data-tab')); return }
  if (e.target.closest('[data-close]')) { closeSheet(); return }
  var ph = e.target.closest('[data-photo]');
  if (ph) { $('#lightboxImg').src = ph.getAttribute('data-photo'); $('#lightbox').hidden = false; return }
  var tp = e.target.closest('[data-trip]');
  if (tp) { showTripDetail(tp.getAttribute('data-trip')); return }
  var cu = e.target.closest('[data-cust]');
  if (cu) { custDetail(cu.getAttribute('data-cust')); return }
  var ed = e.target.closest('[data-edit]');
  if (ed) { openCustForm(ed.getAttribute('data-edit')); return }
  var fo = e.target.closest('[data-follow]');
  if (fo) { openFollowForm(fo.getAttribute('data-follow')); return }
  if (e.target.id === 'tSave') {
    var row = readTripForm(); if (!row) return;
    e.target.disabled = true;
    saveRow('field_trips', row).then(function (ok) {
      if (ok) toast('报备已提交');       // 没传上去时 send() 已经提示过原因，别覆盖成「已提交」
      render();
    }).finally(function () { e.target.disabled = false });
    return;
  }
  if (e.target.id === 'ckShot') { $('#ckFile').click(); return }
  if (e.target.id === 'ckSave') { submitCheckin(); return }
  if (e.target.id === 'cuNew') { openCustForm(''); return }
  if (e.target.id === 'cfSave') { saveCust(); return }
  if (e.target.id === 'ffSave') { saveFollow(); return }
  if (e.target.id === 'outBtn') { doLogout(); return }
  if (e.target.id === 'pullBtn') {
    e.target.disabled = true;
    pullAll().then(function (n) { return flushQueue().then(function () { toast('已拉取 ' + n + ' 条'); render() }) })
      .catch(function (err) { toast('拉取失败：' + err.message, true) })
      .finally(function () { e.target.disabled = false });
    return;
  }
});
// 搜索框只重画列表，整屏重画会让输入框失焦
document.addEventListener('input', function (e) {
  if (e.target.id === 'cuSearch') {
    custQ = e.target.value;
    var box = $('#cuList'); if (box) box.innerHTML = custListHtml();
  }
});
// 客户下拉选「现场新建」时才显示企业名称框；选完照片只补照片区，别把刚填的表单刷掉
document.addEventListener('change', function (e) {
  if (e.target.id === 'ckCust') { var b = $('#ckNewBox'); if (b) b.hidden = e.target.value !== '__new'; return }
  if (e.target.id === 'ckFile') { pickPhoto(e.target.files && e.target.files[0]); e.target.value = '' }
});
async function pickPhoto(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('照片超过 20MB，请重拍', true); return }
  var btn = $('#ckShot'); if (btn) { btn.disabled = true; btn.textContent = '上传中…' }
  try {
    var p = await uploadPhoto(file);
    ckPhoto = p;
    paintPhoto();
    toast('照片已上传');
  } catch (err) {
    toast('照片没传上去：' + err.message, true);
    var b2 = $('#ckShot'); if (b2) { b2.disabled = false; b2.textContent = '📷 重新选择照片' }
  }
}
$('#lightbox').addEventListener('click', function () { this.hidden = true; $('#lightboxImg').src = '' });
$('#liBtn').addEventListener('click', doLogin);
$('#liPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin() });
window.addEventListener('online', function () { flushQueue() });
// 手机从后台切回前台是最常见的「重新有信号」时刻，顺手补传一次
document.addEventListener('visibilitychange', function () { if (!document.hidden && SB.client) flushQueue() });

(function boot() {
  if (!window.JL_SB || !JL_SB.url || !JL_SB.key) { showLogin('后端未配置：请把 Supabase 地址和 key 填进 js/sb-config.js'); return }
  if (!window.supabase) { showLogin('网络没加载完，请下拉刷新或换个网络再试'); return }
  SB.client = window.supabase.createClient(JL_SB.url, JL_SB.key, { auth: { persistSession: true, autoRefreshToken: true } });
  SB.client.auth.getSession().then(function (r) {
    var s = r.data && r.data.session;
    if (!s) { showLogin(); return }
    enterApp(s.user);
  }).catch(function (e) { showLogin('连不上后端：' + e.message) });
})();
